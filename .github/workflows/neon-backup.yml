name: Neon Database Backup

on:
  workflow_dispatch:
  schedule:
    # 每日台灣時間 03:00（UTC 19:00）
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: neon-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create and verify Neon backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show PostgreSQL client version
        run: |
          docker run --rm postgres:18-bookworm pg_dump --version
          docker run --rm postgres:18-bookworm pg_restore --version

      - name: Create snapshot-consistent database dump and row-count manifest
        id: dump
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing GitHub Secret: NEON_BACKUP_DATABASE_URL"
            exit 1
          fi

          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "Invalid backup URL format. Use the native Neon PostgreSQL connection string."
              exit 1
              ;;
          esac

          mkdir -p "$GITHUB_WORKSPACE/backups"
          BACKUP_FILE="family-finance-$(date -u +%Y%m%dT%H%M%SZ).dump"
          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"

          # Keep the exporting transaction open while pg_dump and the row-count
          # query import the same PostgreSQL snapshot.
          coproc SNAPSHOT_SESSION {
            docker run --rm -i --env DATABASE_URL postgres:18-bookworm \
              psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1
          }
          SNAPSHOT_PID="$SNAPSHOT_SESSION_PID"
          SNAPSHOT_READ_FD="${SNAPSHOT_SESSION[0]}"
          SNAPSHOT_WRITE_FD="${SNAPSHOT_SESSION[1]}"

          printf 'BEGIN ISOLATION LEVEL REPEATABLE READ;\nSELECT pg_export_snapshot();\n' >&"$SNAPSHOT_WRITE_FD"
          if ! IFS= read -r SNAPSHOT_ID <&"$SNAPSHOT_READ_FD"; then
            echo "Could not export a PostgreSQL snapshot for the backup."
            exit 1
          fi
          if [ -z "$SNAPSHOT_ID" ]; then
            echo "PostgreSQL returned an empty snapshot identifier."
            exit 1
          fi
          echo "Exported a consistent PostgreSQL snapshot."

          docker run --rm \
            --env DATABASE_URL \
            --env SNAPSHOT_ID \
            --env BACKUP_FILE="$BACKUP_FILE" \
            -v "$GITHUB_WORKSPACE/backups:/backups" \
            postgres:18-bookworm \
            sh -ec 'exec pg_dump --dbname="$DATABASE_URL" --snapshot="$SNAPSHOT_ID" --format=custom --no-owner --no-acl --verbose --file="/backups/$BACKUP_FILE"'

          test -s "$GITHUB_WORKSPACE/backups/$BACKUP_FILE"
          ls -lh "$GITHUB_WORKSPACE/backups/$BACKUP_FILE"

          # Import the very same exported snapshot before counting rows.
          docker run --rm -i \
            --env DATABASE_URL \
            --env SNAPSHOT_ID \
            postgres:18-bookworm \
            psql "$DATABASE_URL" -X -qAt -F "$(printf '\t')" -v ON_ERROR_STOP=1 <<SQL > "$GITHUB_WORKSPACE/backups/row-counts.tsv"
          BEGIN ISOLATION LEVEL REPEATABLE READ;
          SET TRANSACTION SNAPSHOT '$SNAPSHOT_ID';
          SELECT format(
            'SELECT %L, count(*)::bigint FROM %I.%I',
            tablename, schemaname, tablename
          )
          FROM pg_catalog.pg_tables
          WHERE schemaname = 'public'
          ORDER BY tablename
          \gexec
          COMMIT;
          SQL

          test -s "$GITHUB_WORKSPACE/backups/row-counts.tsv"
          echo "Created snapshot-consistent row-count manifest:"
          cat "$GITHUB_WORKSPACE/backups/row-counts.tsv"

          printf 'COMMIT;\n' >&"$SNAPSHOT_WRITE_FD"
          exec {SNAPSHOT_WRITE_FD}>&-
          exec {SNAPSHOT_READ_FD}<&-
          wait "$SNAPSHOT_PID"
          echo "Snapshot transaction closed cleanly."

      - name: Verify dump archive
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.backup_file }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e BACKUP_FILE \
            -v "$GITHUB_WORKSPACE/backups:/backups:ro" \
            postgres:18-bookworm \
            sh -c 'pg_restore --list "/backups/$BACKUP_FILE" > /tmp/restore-list.txt && test -s /tmp/restore-list.txt && head -n 20 /tmp/restore-list.txt'

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-neon-backup-${{ github.run_number }}
          path: backups/*
          if-no-files-found: error
          retention-days: 14
