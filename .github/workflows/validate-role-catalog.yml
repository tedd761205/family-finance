
name: Validate Role Catalog

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/validate-role-catalog.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Role Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Validate role catalog
        run: python -m app.validate_role_catalog
