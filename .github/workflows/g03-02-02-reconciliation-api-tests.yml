name: G-03-02-02 Reconciliation Session API Tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths:
      - "main.py"
      - "app/routers/reconciliation.py"
      - "app/schemas/reconciliation.py"
      - "tests/test_g03_02_02_reconciliation_sessions.py"
      - ".github/workflows/g03-02-02-reconciliation-api-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "app/routers/reconciliation.py"
      - "app/schemas/reconciliation.py"
      - "tests/test_g03_02_02_reconciliation_sessions.py"
      - ".github/workflows/g03-02-02-reconciliation-api-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-session-api:
    name: Session API and data-scope tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile application and tests
        run: python -m compileall -q app tests main.py

      - name: Run reconciliation session API tests
        run: python -m pytest -q tests/test_g03_02_02_reconciliation_sessions.py tests/test_g03_02_01_reconciliation_models.py tests/test_g03_01_bank_import.py
