name: Neon Backup and Restore E2E Launcher

on:
  push:
    branches:
      - fix/restore-backup-row-count-manifest

permissions:
  actions: write
  contents: read

concurrency:
  group: neon-backup-restore-e2e-launcher
  cancel-in-progress: true

jobs:
  run-backup-and-restore:
    name: Run backup then isolated restore test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dispatch backup, wait for success, then dispatch restore test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_url = os.environ["GH_API_URL"].rstrip("/")
          expected_sha = os.environ["GH_SHA"]
          branch = os.environ["GH_BRANCH"]
          if branch != "fix/restore-backup-row-count-manifest":
              raise SystemExit("Refusing to run outside the reviewed PR branch.")
          if not token:
              raise SystemExit("Missing GitHub Actions token.")

          base = api_url + "/repos/" + urllib.parse.quote(repository, safe="/")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path,
                  data=data,
                  headers={**headers, **({"Content-Type": "application/json"} if data is not None else {})},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return response.status, (json.loads(body) if body else None)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:1000]
                  raise SystemExit(f"GitHub API {method} {path} failed with HTTP {exc.code}: {detail}") from exc
              except urllib.error.URLError as exc:
                  raise SystemExit(f"GitHub API {method} {path} could not be reached: {exc}") from exc

          def workflow_id(path):
              # The Actions API accepts a workflow filename or numeric ID,
              # not the full .github/workflows/... repository path.
              filename = path.rsplit("/", 1)[-1]
              _, result = api("GET", "/actions/workflows/" + urllib.parse.quote(filename, safe=""))
              if not result or not result.get("id") or result.get("path") != path:
                  raise SystemExit(f"Could not resolve the expected workflow file: {path}")
              wid = result["id"]
              if result.get("state") != "active":
                  print(f"Enabling the explicitly selected workflow: {path} (current state: {result.get('state')})", flush=True)
                  api("PUT", f"/actions/workflows/{wid}/enable")
                  _, refreshed = api("GET", "/actions/workflows/" + urllib.parse.quote(filename, safe=""))
                  if not refreshed or refreshed.get("state") != "active":
                      raise SystemExit(f"Could not enable the selected workflow: {path}")
              return wid

          def dispatch_and_wait(workflow_path, inputs=None, timeout_minutes=45):
              wid = workflow_id(workflow_path)
              started = datetime.datetime.now(datetime.timezone.utc)
              payload = {"ref": branch}
              if inputs:
                  payload["inputs"] = inputs
              api("POST", f"/actions/workflows/{wid}/dispatches", payload)
              print(f"Dispatched {workflow_path} on {branch}; waiting for completion.", flush=True)

              deadline = time.monotonic() + timeout_minutes * 60
              while time.monotonic() < deadline:
                  _, response = api(
                      "GET",
                      f"/actions/workflows/{wid}/runs?branch={urllib.parse.quote(branch)}&event=workflow_dispatch&per_page=50",
                  )
                  candidates = []
                  for run in (response or {}).get("workflow_runs", []):
                      if run.get("head_sha") != expected_sha:
                          continue
                      created = run.get("created_at")
                      if not created:
                          continue
                      created_at = datetime.datetime.fromisoformat(created.replace("Z", "+00:00"))
                      if created_at >= started - datetime.timedelta(seconds=30):
                          candidates.append(run)
                  if candidates:
                      run = max(candidates, key=lambda item: item.get("run_number", 0))
                      print(
                          f"{workflow_path}: run_id={run.get('id')} status={run.get('status')} "
                          f"conclusion={run.get('conclusion')}",
                          flush=True,
                      )
                      if run.get("status") == "completed":
                          if run.get("conclusion") != "success":
                              raise SystemExit(
                                  f"{workflow_path} completed with conclusion={run.get('conclusion')}; "
                                  "the next stage will not run."
                              )
                          return run
                  time.sleep(15)
              raise SystemExit(f"Timed out waiting for {workflow_path}; no follow-on destructive step was started.")

          # Cancel only the earlier queued backup run created by this same E2E attempt.
          # It used the previous shared concurrency key and must not outlive the latest run.
          stale_backup_run_id = 45351959777
          _, stale_backup = api("GET", f"/actions/runs/{stale_backup_run_id}")
          if stale_backup and stale_backup.get("head_branch") == branch and stale_backup.get("status") in {"queued", "in_progress"}:
              api("POST", f"/actions/runs/{stale_backup_run_id}/cancel")
              print(f"Cancelled superseded queued backup run {stale_backup_run_id}.", flush=True)

          backup = dispatch_and_wait(" .github/workflows/neon-backup.yml".strip(), timeout_minutes=35)
          backup_run_id = str(backup["id"])
          print(f"BACKUP_RUN_ID={backup_run_id}", flush=True)

          restore = dispatch_and_wait(
              ".github/workflows/neon-restore-test.yml",
              inputs={
                  "backup_run_id": backup_run_id,
                  "target_confirmation": "g01-restore-test",
              },
              timeout_minutes=50,
          )
          restore_run_id = str(restore["id"])

          _, artifacts_response = api("GET", f"/actions/runs/{restore_run_id}/artifacts?per_page=100")
          artifacts = [
              item for item in (artifacts_response or {}).get("artifacts", [])
              if item.get("name") == "neon-restore-test-provenance"
              and item.get("expired") is False
              and item.get("size_in_bytes", 0) > 0
          ]
          if len(artifacts) != 1:
              raise SystemExit("Restore passed, but its provenance artifact was not found exactly once.")

          summary = (
              "# Neon backup and restore E2E result\n\n"
              f"- Backup run: {backup_run_id} (success)\n"
              f"- Restore run: {restore_run_id} (success)\n"
              f"- Backup source commit: {expected_sha}\n"
              "- Restore target: g01-restore-test\n"
              "- Restore provenance artifact: verified\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary, flush=True)
          PY
