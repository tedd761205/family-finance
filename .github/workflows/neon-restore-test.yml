name: Neon Restore Test

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Successful Neon Database Backup workflow run ID"
        required: true
        type: string
      backup_object_key:
        description: "Exact private Neon dump key, e.g. production/family-finance-20261124T030000Z.dump"
        required: true
        type: string
      target_confirmation:
        description: "Type exactly g01-restore-test to authorize replacing objects in that test branch"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: neon-restore-test
  cancel-in-progress: false

jobs:
  restore:
    # Manual pre-merge validation is limited to this reviewed PR branch and main.
    name: Restore backup into isolated test branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate current approved restore workflow ref
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_REF:$WORKFLOW_EVENT" in
            refs/heads/main:workflow_dispatch|refs/heads/security/neon-private-backup-storage:workflow_dispatch)
              ;;
            *)
              echo "Refusing restore from an unapproved branch or event: $WORKFLOW_REF / $WORKFLOW_EVENT"
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          branch = os.environ["WORKFLOW_REF"].removeprefix("refs/heads/")
          workflow_sha = os.environ["WORKFLOW_SHA"]
          token = os.environ["GH_TOKEN"]
          if not token or not workflow_sha:
              raise SystemExit("Missing GitHub token or workflow commit SHA.")
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {token}", "X-GitHub-Api-Version": "2022-11-28"}
          if branch == "main":
              url = f"{api_url}/repos/{repository}/git/ref/heads/main"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                      current_sha = (json.load(response).get("object") or {}).get("sha")
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  raise SystemExit("Could not verify the current main branch commit.") from exc
              if current_sha != workflow_sha:
                  raise SystemExit("Refusing restore: workflow is not running the current main commit.")
          else:
              url = f"{api_url}/repos/{repository}/pulls/61"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                      pr = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  raise SystemExit("Could not verify PR #61 before starting restore.") from exc
              head = pr.get("head") or {}
              base = pr.get("base") or {}
              head_repo = head.get("repo") or {}
              if (
                  pr.get("state") != "open"
                  or pr.get("draft") is not True
                  or head.get("ref") != branch
                  or head_repo.get("full_name") != repository
                  or base.get("ref") != "main"
                  or head.get("sha") != workflow_sha
              ):
                  raise SystemExit("Refusing restore: PR #61 is not open as a draft at the exact workflow commit.")
          print("Restore workflow ref is the current main commit or the exact open draft PR #61 head.")
          PY
      - name: Resolve backup run and authorize restore target
        id: source
        env:
          BACKUP_RUN_ID_INPUT: ${{ inputs.backup_run_id }}
          TARGET_CONFIRMATION_INPUT: ${{ inputs.target_confirmation }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          branch = os.environ["WORKFLOW_BRANCH"]
          event = os.environ["WORKFLOW_EVENT"]
          expected_sha = os.environ["WORKFLOW_SHA"]
          if not token or not expected_sha:
              raise SystemExit("Missing GitHub token or source commit SHA.")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          encoded_repo = urllib.parse.quote(repository, safe="/")

          def github_get(path):
              request = urllib.request.Request(api_url + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  raise SystemExit(f"Could not verify backup source through GitHub API: {path}") from exc

          if event == "workflow_dispatch":
              backup_run_id = os.environ["BACKUP_RUN_ID_INPUT"].strip()
              target_confirmation = os.environ["TARGET_CONFIRMATION_INPUT"].strip()
              if not backup_run_id.isdigit():
                  raise SystemExit("backup_run_id must contain digits only.")
              if target_confirmation != "g01-restore-test":
                  raise SystemExit("Refusing to run: type exactly g01-restore-test in target_confirmation.")
          else:
              raise SystemExit("Unsupported restore trigger event.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"backup_run_id={backup_run_id}\n")
              output.write(f"target_confirmation={target_confirmation}\n")
          print(f"Resolved successful backup run {backup_run_id}; target is g01-restore-test.", flush=True)
          PY

      - name: Record restore provenance
        env:
          BACKUP_RUN_ID: ${{ steps.source.outputs.backup_run_id }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
          TARGET_CONFIRMATION: ${{ steps.source.outputs.target_confirmation }}
        run: |
          set -euo pipefail
          mkdir -p restore-provenance
          printf 'backup_run_id=%s\n' "$BACKUP_RUN_ID" > restore-provenance/restore.txt
          printf 'backup_object_key=%s\n' "$BACKUP_OBJECT_KEY" >> restore-provenance/restore.txt
          printf 'target_confirmation=%s\n' "$TARGET_CONFIRMATION" >> restore-provenance/restore.txt

      - name: Validate explicit target confirmation
        env:
          BACKUP_RUN_ID: ${{ steps.source.outputs.backup_run_id }}
          TARGET_CONFIRMATION: ${{ steps.source.outputs.target_confirmation }}
        run: |
          set -euo pipefail
          case "$BACKUP_RUN_ID" in
            ''|*[!0-9]*)
              echo "backup_run_id must contain digits only."
              exit 1
              ;;
          esac
          if [ "$TARGET_CONFIRMATION" != "g01-restore-test" ]; then
            echo "Refusing to run: target confirmation is not g01-restore-test."
            exit 1
          fi
          echo "Explicit or pre-authorized isolated test-branch confirmation received."

      - name: Verify selected backup run and artifact provenance
        id: backup_source
        env:
          BACKUP_RUN_ID: ${{ steps.source.outputs.backup_run_id }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta

          repository = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["BACKUP_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")
          if not token:
              raise SystemExit("Missing GitHub token for backup provenance validation.")

          def github_get(path):
              request = urllib.request.Request(
                  api_url + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  raise SystemExit("Could not validate the selected backup run through the GitHub API.") from exc

          encoded_repo = urllib.parse.quote(repository, safe="/")
          run = github_get(f"/repos/{encoded_repo}/actions/runs/{run_id}")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("Refusing to restore: selected backup workflow run has not completed successfully.")
          head_branch = run.get("head_branch")
          head_sha = run.get("head_sha") or ""
          if not head_sha:
              raise SystemExit("Selected backup run has no source commit SHA.")
          if head_branch == "main":
              if run.get("event") not in {"schedule", "workflow_dispatch"}:
                  raise SystemExit("Refusing to restore: main-branch backups must come from a scheduled or manual backup run.")
              ref = github_get(f"/repos/{encoded_repo}/git/ref/heads/main")
              current_sha = (ref.get("object") or {}).get("sha")
              if not current_sha or head_sha != current_sha:
                  raise SystemExit("Refusing to restore: the main-branch backup was created from a stale commit.")
          elif head_branch == "security/neon-private-backup-storage":
              if run.get("event") != "workflow_dispatch":
                  raise SystemExit("Refusing to restore: pre-merge PR backups must come from an explicit manual dispatch.")
              pr = github_get(f"/repos/{encoded_repo}/pulls/61")
              pr_head = pr.get("head") or {}
              pr_base = pr.get("base") or {}
              pr_head_repo = pr_head.get("repo") or {}
              if (
                  pr.get("state") != "open"
                  or pr.get("draft") is not True
                  or pr_head.get("ref") != head_branch
                  or pr_head_repo.get("full_name") != repository
                  or pr_base.get("ref") != "main"
                  or pr_head.get("sha") != head_sha
              ):
                  raise SystemExit("Refusing to restore: PR #61 is not open as a draft at the exact commit used by this backup run.")
          else:
              raise SystemExit("Refusing to restore: backup run was not created from an approved branch.")
          head_repository = (run.get("head_repository") or {}).get("full_name")
          if head_repository != repository:
              raise SystemExit("Refusing to restore: selected backup run did not originate from this repository.")
          workflow_id = run.get("workflow_id")
          if not workflow_id:
              raise SystemExit("Selected backup run has no workflow ID.")
          workflow = github_get(f"/repos/{encoded_repo}/actions/workflows/{workflow_id}")
          if workflow.get("path") != ".github/workflows/neon-backup.yml":
              raise SystemExit("Refusing to restore: selected run does not belong to Neon Database Backup.")
          run_number = run.get("run_number")
          if not isinstance(run_number, int) or run_number < 1:
              raise SystemExit("Selected backup run has an invalid run number.")
          object_key = os.environ.get("BACKUP_OBJECT_KEY", "").strip()
          if not re.fullmatch(r"production/family-finance-[0-9]{8}T[0-9]{6}Z\.dump", object_key):
              raise SystemExit("BACKUP_OBJECT_KEY must be an exact private Production backup object key.")
          object_stamp = object_key.rsplit("-", 1)[1].removesuffix(".dump")
          object_time = datetime.strptime(object_stamp, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc)
          run_time = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          if object_time > now or now - object_time > timedelta(hours=24):
              raise SystemExit("Selected private backup object must be no older than 24 hours.")
          if abs((object_time - run_time).total_seconds()) > 3600:
              raise SystemExit("Private backup object timestamp does not match the selected backup workflow run.")
          manifest_key = object_key[:-5] + ".row-counts.tsv"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"backup_object_key={object_key}\n")
              output.write(f"backup_manifest_key={manifest_key}\n")
              output.write(f"run_number={run_number}\n")
              output.write(f"head_sha={head_sha}\n")
              output.write(f"workflow_id={workflow_id}\n")
          with open("restore-provenance/restore.txt", "a", encoding="utf-8") as provenance_file:
              provenance_file.write(f"backup_run_number={run_number}\n")
              provenance_file.write(f"backup_head_sha={head_sha}\n")
              provenance_file.write(f"backup_workflow_id={workflow_id}\n")
              provenance_file.write(f"backup_manifest_key={manifest_key}\n")
          print("GitHub confirmed the successful backup run; its private dump and snapshot manifest will be verified directly in Neon Object Storage.")
          PY

      - name: Install S3 client
        run: |
          python -m pip install --disable-pip-version-check "boto3>=1.35,<2.0"

      - name: Download and verify private dump and row-count manifest from Neon Object Storage
        env:
          BACKUP_OBJECT_KEY: ${{ steps.backup_source.outputs.backup_object_key }}
          BACKUP_MANIFEST_KEY: ${{ steps.backup_source.outputs.backup_manifest_key }}
          NEON_STORAGE_ENDPOINT: ${{ vars.NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
          NEON_BACKUP_BUCKET: ${{ vars.NEON_BACKUP_BUCKET }}
          NEON_RESTORE_S3_ACCESS_KEY_ID: ${{ secrets.NEON_RESTORE_S3_ACCESS_KEY_ID }}
          NEON_RESTORE_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_RESTORE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p restore-input
          python - <<'PY'
          import csv
          import hashlib
          import os
          import re
          from pathlib import Path

          import boto3
          from botocore.config import Config

          dump_key = os.environ["BACKUP_OBJECT_KEY"].strip()
          manifest_key = os.environ["BACKUP_MANIFEST_KEY"].strip()
          expected_manifest_key = dump_key[:-5] + ".row-counts.tsv"
          if not re.fullmatch(r"production/family-finance-[0-9]{8}T[0-9]{6}Z\.dump", dump_key):
              raise SystemExit("Refusing to download a key outside the approved Production backup format.")
          if manifest_key != expected_manifest_key:
              raise SystemExit("Selected row-count manifest key does not correspond to the selected dump key.")

          endpoint = os.environ["NEON_STORAGE_ENDPOINT"].strip()
          region = os.environ["NEON_STORAGE_REGION"].strip()
          bucket = os.environ["NEON_BACKUP_BUCKET"].strip()
          access_key = os.environ["NEON_RESTORE_S3_ACCESS_KEY_ID"].strip()
          secret_key = os.environ["NEON_RESTORE_S3_SECRET_ACCESS_KEY"]
          if not endpoint.startswith("https://") or not region or not bucket or not access_key or not secret_key:
              raise SystemExit("Missing private Neon Object Storage read-only credentials or configuration.")

          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              config=Config(
                  signature_version="s3v4",
                  s3={"addressing_style": "path"},
                  retries={"max_attempts": 3, "mode": "standard"},
              ),
          )

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          dump_head = client.head_object(Bucket=bucket, Key=dump_key)
          manifest_head = client.head_object(Bucket=bucket, Key=manifest_key)
          expected_objects = [
              (dump_key, Path("restore-input") / Path(dump_key).name, dump_head, "dump"),
              (manifest_key, Path("restore-input") / "row-counts.tsv", manifest_head, "manifest"),
          ]
          verified = {}
          for key, destination, head, label in expected_objects:
              size = head.get("ContentLength", 0)
              digest = head.get("Metadata", {}).get("sha256", "")
              if size <= 0 or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"Private backup {label} object is empty or missing SHA-256 metadata.")
              client.download_file(bucket, key, str(destination))
              actual_size = destination.stat().st_size
              actual_digest = sha256_file(destination)
              if actual_size != size or actual_digest != digest:
                  raise SystemExit(f"Downloaded backup {label} does not match private object metadata.")
              verified[label] = {"size": actual_size, "sha256": actual_digest}
              print(f"Verified private backup {label}: {key}")

          with (Path("restore-input") / "row-counts.tsv").open(encoding="utf-8", newline="") as manifest_file:
              rows = list(csv.reader(manifest_file, delimiter="\t"))
          if not rows or any(len(row) != 2 or not row[0] or not row[1].isdigit() for row in rows):
              raise SystemExit("Downloaded row-count manifest has an invalid format.")
          if len({row[0] for row in rows}) != len(rows):
              raise SystemExit("Downloaded row-count manifest contains duplicate table names.")

          with open("restore-provenance/restore.txt", "a", encoding="utf-8") as provenance_file:
              provenance_file.write(f"backup_size_bytes={verified['dump']['size']}\n")
              provenance_file.write(f"backup_sha256={verified['dump']['sha256']}\n")
              provenance_file.write(f"backup_manifest_key={manifest_key}\n")
              provenance_file.write(f"backup_manifest_size_bytes={verified['manifest']['size']}\n")
              provenance_file.write(f"backup_manifest_sha256={verified['manifest']['sha256']}\n")
          print(f"Dump size: {verified['dump']['size']} bytes; SHA-256: {verified['dump']['sha256']}")
          print(f"Manifest size: {verified['manifest']['size']} bytes; SHA-256: {verified['manifest']['sha256']}")
          PY

      - name: Locate and validate dump file
        id: dump
        run: |
          set -euo pipefail
          mapfile -t DUMPS < <(find restore-input -type f -name '*.dump' -print)
          if [ "${#DUMPS[@]}" -ne 1 ]; then
            echo "Expected exactly one .dump file in the selected backup artifact; found ${#DUMPS[@]}."
            find restore-input -maxdepth 3 -type f -printf '%p\n'
            exit 1
          fi
          DUMP_PATH="${DUMPS[0]}"
          test -s "$DUMP_PATH"
          echo "dump_path=$DUMP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found one non-empty PostgreSQL custom-format dump."
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" postgres:18-bookworm \
            pg_restore --list "/work/$DUMP_PATH" > /tmp/restore-list.txt
          test -s /tmp/restore-list.txt
          echo "Backup archive is readable."

      - name: Locate and validate backup row-count manifest
        id: manifest
        run: |
          set -euo pipefail
          mapfile -t MANIFESTS < <(find restore-input -type f -name 'row-counts.tsv' -print)
          if [ "${#MANIFESTS[@]}" -ne 1 ]; then
            echo "Expected exactly one row-count manifest in the selected backup artifact; found ${#MANIFESTS[@]}."
            find restore-input -maxdepth 3 -type f -print
            exit 1
          fi
          MANIFEST_PATH="${MANIFESTS[0]}"
          test -s "$MANIFEST_PATH"
          if ! awk -F '\t' 'NF != 2 || $1 == "" || $2 !~ /^[0-9]+$/ { exit 1 }' "$MANIFEST_PATH"; then
            echo "Backup row-count manifest has an invalid format."
            exit 1
          fi
          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "Found one valid backup row-count manifest."

      - name: Validate test database connection and branch endpoint
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.NEON_RESTORE_TEST_HOST }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_PROJECT_ID: wild-credit-40100572
          EXPECTED_BRANCH_ID: ${{ vars.NEON_RESTORE_TEST_BRANCH_ID }}
        run: |
          set -euo pipefail
          case "${DATABASE_URL:-}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "Missing or invalid NEON_RESTORE_TEST_DATABASE_URL. Use a native PostgreSQL URI."
              exit 1
              ;;
          esac
          if [ -z "${EXPECTED_HOST:-}" ]; then
            echo "Missing repository variable NEON_RESTORE_TEST_HOST. Set it to the endpoint hostname shown for g01-restore-test in Neon."
            exit 1
          fi
          ACTUAL_HOST="$(python3 -c 'import os, urllib.parse; print((urllib.parse.urlparse(os.environ["DATABASE_URL"]).hostname or "").lower())')"
          EXPECTED_HOST_NORMALIZED="$(printf '%s' "$EXPECTED_HOST" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_HOST" ] || [ "$ACTUAL_HOST" != "$EXPECTED_HOST_NORMALIZED" ]; then
            echo "Refusing to restore: database URL endpoint does not match NEON_RESTORE_TEST_HOST."
            exit 1
          fi
          export ACTUAL_HOST
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${EXPECTED_BRANCH_ID:-}" ]; then
            echo "Missing NEON_API_KEY secret or NEON_RESTORE_TEST_BRANCH_ID variable."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          actual_host = os.environ["ACTUAL_HOST"].strip().lower()
          project_id = os.environ["EXPECTED_PROJECT_ID"]
          branch_id = os.environ["EXPECTED_BRANCH_ID"].strip()
          if not branch_id.startswith("br-"):
              raise SystemExit("NEON_RESTORE_TEST_BRANCH_ID must be a Neon branch ID.")
          request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{project_id}/branches/{branch_id}",
              headers={"Accept": "application/json", "Authorization": f"Bearer {os.environ['NEON_API_KEY']}"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  branch = json.load(response).get("branch", {})
          except (urllib.error.HTTPError, urllib.error.URLError) as exc:
              raise SystemExit("Could not verify the configured restore-test branch through the Neon API.") from exc
          if (
              branch.get("id") != branch_id
              or branch.get("project_id") != project_id
              or branch.get("name") != "g01-restore-test"
              or branch.get("parent_id") != "br-jolly-breeze-b3mereg2"
              or branch.get("default") is not False
              or branch.get("protected") is not False
              or branch.get("primary") is True
          ):
              raise SystemExit("Refusing to restore: Neon API did not confirm the isolated, non-default g01-restore-test child branch.")
          endpoints_request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{project_id}/branches/{branch_id}/endpoints",
              headers={"Accept": "application/json", "Authorization": f"Bearer {os.environ['NEON_API_KEY']}"},
          )
          try:
              with urllib.request.urlopen(endpoints_request, timeout=20) as response:
                  endpoints = json.load(response).get("endpoints", [])
          except (urllib.error.HTTPError, urllib.error.URLError) as exc:
              raise SystemExit("Could not verify the restore-test branch endpoint through the Neon API.") from exc
          rw_endpoints = [item for item in endpoints if item.get("type") == "read_write" and not item.get("disabled")]
          if len(rw_endpoints) != 1 or rw_endpoints[0].get("branch_id") != branch_id or rw_endpoints[0].get("project_id") != project_id:
              raise SystemExit("Refusing to restore: expected exactly one active read-write endpoint on g01-restore-test.")
          endpoint_host = (rw_endpoints[0].get("host") or "").lower()
          allowed_hosts = {endpoint_host, endpoint_host.replace(".", "-pooler.", 1)}
          if actual_host not in allowed_hosts:
              raise SystemExit("Refusing to restore: database URL hostname is not the API-confirmed g01-restore-test endpoint.")
          with open("restore-provenance/restore.txt", "a", encoding="utf-8") as provenance_file:
              provenance_file.write(f"project_id={project_id}\n")
              provenance_file.write(f"branch_id={branch_id}\n")
              provenance_file.write("branch_name=g01-restore-test\n")
              provenance_file.write(f"endpoint_host={endpoint_host}\n")
          print("Neon API confirmed the exact restore-test branch, project, and connected endpoint.")
          PY
          echo "Neon endpoint and branch identity checks passed."
          docker run --rm --env DATABASE_URL postgres:18-bookworm \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT 'database=' || current_database() || '; role=' || current_user;"
          echo "Connection succeeded. Target endpoint guard passed."

      - name: Reset public schema on verified test branch
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Resetting only the public schema after the Neon branch identity guard passed."
          docker run --rm --env DATABASE_URL postgres:18-bookworm \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "BEGIN; DROP SCHEMA public CASCADE; CREATE SCHEMA public AUTHORIZATION CURRENT_USER; GRANT USAGE ON SCHEMA public TO PUBLIC; COMMIT;"
          echo "The isolated test branch public schema is empty and ready for restore."

      - name: Restore dump into test branch
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
          DUMP_PATH: ${{ steps.dump.outputs.dump_path }}
        run: |
          set -euo pipefail
          docker run --rm \
            --env DATABASE_URL \
            --env DUMP_PATH \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            postgres:18-bookworm \
            sh -ec 'exec pg_restore --dbname="$DATABASE_URL" --no-owner --no-acl --exit-on-error --verbose "/work/$DUMP_PATH"'

      - name: Verify restored schema and data
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm --env DATABASE_URL postgres:18-bookworm \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off -c "
              SELECT
                (SELECT count(*) FROM information_schema.tables
                 WHERE table_schema = 'public' AND table_type = 'BASE TABLE') AS public_table_count,
                (SELECT count(*) FROM information_schema.triggers
                 WHERE trigger_schema = 'public') AS public_trigger_count,
                (SELECT count(*) FROM pg_indexes
                 WHERE schemaname = 'public') AS public_index_count,
                (SELECT count(*) FROM public.alembic_version) AS alembic_version_rows;
            "
      - name: Verify restored baseline revision and exact schema
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
        run: |
          set -euo pipefail
          REVISION="$(docker run --rm --env DATABASE_URL postgres:18-bookworm psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT version_num FROM public.alembic_version")"
          if [ "$REVISION" != "f2a4c6e8b0d2" ]; then
            echo "Expected restored Production baseline f2a4c6e8b0d2; found: $REVISION"
            exit 1
          fi
          cat > /tmp/expected-public-tables.txt <<'TABLES'
          accounts
          alembic_version
          attachments
          audit_logs
          bank_import_batches
          bank_import_rows
          bill_payments
          bills
          categories
          credit_card_payments
          export_runs
          export_schedules
          export_template_versions
          export_templates
          families
          family_invitations
          family_members
          member_roles
          notifications
          ocr_tasks
          password_reset_tokens
          permissions
          recurring_bills
          reconciliation_exclusions
          reconciliation_issues
          reconciliation_matches
          reconciliation_sessions
          revoked_tokens
          role_data_scopes
          role_permissions
          roles
          transactions
          transfers
          user_identities
          users
          TABLES
          docker run --rm --env DATABASE_URL postgres:18-bookworm \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname='public' ORDER BY tablename" \
            > /tmp/actual-public-tables.txt
          sort -o /tmp/expected-public-tables.txt /tmp/expected-public-tables.txt
          diff -u /tmp/expected-public-tables.txt /tmp/actual-public-tables.txt
          echo "Restored schema matches the 35-table Production baseline at f2a4c6e8b0d2."

          if [ -z "${MANIFEST_PATH:-}" ] || [ ! -s "$MANIFEST_PATH" ]; then
            echo "Missing backup row-count manifest."
            exit 1
          fi
          # Build one deterministic query from the restored public tables.
          COUNT_QUERY="$(docker run --rm --env DATABASE_URL postgres:18-bookworm \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
              SELECT string_agg(
                format('SELECT %L AS table_name, count(*)::bigint AS row_count FROM %I.%I',
                       tablename, schemaname, tablename),
                ' UNION ALL ' ORDER BY tablename
              )
              FROM pg_catalog.pg_tables
              WHERE schemaname = 'public';
            ")"
          if [ -z "$COUNT_QUERY" ]; then
            echo "No public tables found after restore."
            exit 1
          fi
          docker run --rm --env DATABASE_URL postgres:18-bookworm \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -AtF "$(printf '\t')" \
            -c "$COUNT_QUERY ORDER BY table_name" > /tmp/restored-row-counts.tsv

          sort "$MANIFEST_PATH" > /tmp/expected-row-counts.tsv
          sort /tmp/restored-row-counts.tsv > /tmp/actual-row-counts.tsv
          echo "Comparing restored table counts with the manifest generated from this exact backup:"
          diff -u /tmp/expected-row-counts.tsv /tmp/actual-row-counts.tsv
          echo "All restored public table row counts match the selected backup manifest."

      - name: Upload restore provenance
        uses: actions/upload-artifact@v4
        with:
          name: neon-restore-test-provenance
          path: restore-provenance/restore.txt
          if-no-files-found: error
          retention-days: 14
