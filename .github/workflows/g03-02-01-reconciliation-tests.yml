name: G-03-02-01 Reconciliation Model Tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths:
      - "app/models/**"
      - "app/permission_catalog.py"
      - "app/role_catalog.py"
      - "alembic/versions/**"
      - "tests/test_g03_02_01_reconciliation_models.py"
      - "tests/test_g03_01_bank_import.py"
      - ".github/workflows/g03-02-01-reconciliation-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    branches:
      - main
    paths:
      - "app/models/**"
      - "app/permission_catalog.py"
      - "app/role_catalog.py"
      - "alembic/versions/**"
      - "tests/test_g03_02_01_reconciliation_models.py"
      - "tests/test_g03_01_bank_import.py"
      - ".github/workflows/g03-02-01-reconciliation-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-models:
    name: Reconciliation schema and permission tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile application and migrations
        run: python -m compileall -q app tests alembic/versions

      - name: Validate Alembic revision graph
        run: alembic heads

      - name: Run reconciliation and bank import tests
        run: python -m pytest -q tests/test_g03_02_01_reconciliation_models.py tests/test_g03_01_bank_import.py
