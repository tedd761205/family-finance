name: G-02-01 Web Interface Tests

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "main.py"
      - "static/**"
      - "tests/test_g02_01_web.py"
      - "tests/test_g02_02_accounts_web.py"
      - ".github/workflows/g02-01-web-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "static/**"
      - "tests/test_g02_01_web.py"
      - ".github/workflows/g02-01-web-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-interface:
    name: Login and family home smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run G-02-01 web interface tests
        run: python -m pytest -q tests/test_g02_01_web.py tests/test_g02_02_accounts_web.py
