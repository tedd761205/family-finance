name: Apply Alembic Migration

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Successful Neon Database Backup workflow run ID (maximum age 24 hours)"
        required: true
        type: string
      backup_object_key:
        description: "Exact private Neon Object Storage key, e.g. production/family-finance-20261119T005812Z.dump"
        required: true
        type: string
      restore_run_id:
        description: "Successful Neon Restore Test run ID using the selected backup"
        required: true
        type: string
      rehearsal_run_id:
        description: "Successful G-01-08 restored-snapshot migration rehearsal run ID"
        required: true
        type: string
      target_confirmation:
        description: "Type exactly family-finance-production to authorize production migration"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: family-finance-production-migration
  cancel-in-progress: false

jobs:
  upgrade-database:
    name: Guard and upgrade production database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "boto3>=1.35,<2.0"

      - name: Download restore-test provenance
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: neon-restore-test-provenance
          path: restore-evidence

      - name: Validate explicit authorization and evidence runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
          RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
          TARGET_CONFIRMATION: ${{ inputs.target_confirmation }}
          NEON_STORAGE_ENDPOINT: ${{ vars.NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
          NEON_BACKUP_BUCKET: ${{ vars.NEON_BACKUP_BUCKET }}
          NEON_RESTORE_S3_ACCESS_KEY_ID: ${{ secrets.NEON_RESTORE_S3_ACCESS_KEY_ID }}
          NEON_RESTORE_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_RESTORE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone, timedelta

          import boto3
          from botocore.config import Config

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          if os.environ["TARGET_CONFIRMATION"] != "family-finance-production":
              raise SystemExit("Refusing to proceed: target_confirmation must be exactly family-finance-production.")

          def numeric_id(name):
              value = os.environ.get(name, "")
              if not value.isdigit():
                  raise SystemExit(f"{name} must contain digits only.")
              return value

          ids = {
              "backup": numeric_id("BACKUP_RUN_ID"),
              "restore": numeric_id("RESTORE_RUN_ID"),
              "rehearsal": numeric_id("REHEARSAL_RUN_ID"),
          }
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"Could not verify required GitHub evidence (HTTP {exc.code}).") from exc

          def as_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          expected_paths = {
              "backup": ".github/workflows/neon-backup.yml",
              "restore": ".github/workflows/neon-restore-test.yml",
              "rehearsal": ".github/workflows/g01-08-restored-db-migration-rehearsal.yml",
          }
          runs = {}
          for key, value in ids.items():
              run = get_json(f"/actions/runs/{value}")
              if run.get("repository", {}).get("full_name", "").lower() != repo.lower():
                  raise SystemExit(f"The {key} evidence run belongs to a different repository.")
              if run.get("path") != expected_paths[key]:
                  raise SystemExit(f"The {key} evidence run is not from the expected workflow.")
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  raise SystemExit(f"The {key} evidence run has not completed successfully.")
              if run.get("head_branch") != "main":
                  raise SystemExit(f"The {key} evidence run was not executed from main.")
              runs[key] = run

          now = datetime.now(timezone.utc)
          backup_time = as_time(runs["backup"]["created_at"])
          restore_time = as_time(runs["restore"]["created_at"])
          rehearsal_time = as_time(runs["rehearsal"]["created_at"])
          if now - backup_time > timedelta(hours=24) or backup_time > now:
              raise SystemExit("The successful backup workflow run must be no older than 24 hours.")
          if not backup_time <= restore_time <= rehearsal_time <= now:
              raise SystemExit("Evidence order must be backup, restore test, then migration rehearsal.")
          rehearsal_sha = runs["rehearsal"].get("head_sha", "")
          if not rehearsal_sha:
              raise SystemExit("Migration rehearsal run has no commit SHA.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"REHEARSAL_SHA={rehearsal_sha}\n")

          object_key = os.environ.get("BACKUP_OBJECT_KEY", "").strip()
          if not re.fullmatch(r"production/family-finance-[0-9]{8}T[0-9]{6}Z\.dump", object_key):
              raise SystemExit("BACKUP_OBJECT_KEY must be an exact production backup object key.")
          object_timestamp = datetime.strptime(
              object_key.rsplit("-", 1)[1].removesuffix(".dump"),
              "%Y%m%dT%H%M%SZ",
          ).replace(tzinfo=timezone.utc)
          if abs((object_timestamp - backup_time).total_seconds()) > 3600:
              raise SystemExit("The selected private backup object's timestamp does not match the selected backup workflow run.")
          if object_timestamp > now or now - object_timestamp > timedelta(hours=24):
              raise SystemExit("The selected private backup object must be no older than 24 hours.")

          endpoint = os.environ.get("NEON_STORAGE_ENDPOINT", "").strip()
          region = os.environ.get("NEON_STORAGE_REGION", "").strip()
          bucket = os.environ.get("NEON_BACKUP_BUCKET", "").strip()
          access_key = os.environ.get("NEON_RESTORE_S3_ACCESS_KEY_ID", "").strip()
          secret_key = os.environ.get("NEON_RESTORE_S3_SECRET_ACCESS_KEY", "")
          if not endpoint.startswith("https://") or not region or not bucket or not access_key or not secret_key:
              raise SystemExit("Missing private Neon Object Storage read-only credentials or configuration.")
          storage = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              config=Config(
                  signature_version="s3v4",
                  s3={"addressing_style": "path"},
                  retries={"max_attempts": 3, "mode": "standard"},
              ),
          )
          try:
              backup_head = storage.head_object(Bucket=bucket, Key=object_key)
          except Exception as exc:
              raise SystemExit("The selected private Neon backup object could not be verified.") from exc
          if backup_head.get("ContentLength", 0) <= 0 or not re.fullmatch(
              r"[0-9a-f]{64}", backup_head.get("Metadata", {}).get("sha256", "")
          ):
              raise SystemExit("The selected private Neon backup object is empty or missing SHA-256 metadata.")

          provenance_path = "restore-evidence/restore.txt"
          try:
              with open(provenance_path, encoding="utf-8") as provenance_file:
                  provenance = dict(
                      line.strip().split("=", 1)
                      for line in provenance_file
                      if "=" in line
                  )
          except OSError as exc:
              raise SystemExit("Restore-test provenance artifact is missing or unreadable.") from exc
          if provenance.get("backup_object_key") != object_key:
              raise SystemExit("Restore-test provenance does not match the selected private backup object key.")
          if provenance.get("backup_size_bytes") != str(backup_head.get("ContentLength", "")):
              raise SystemExit("Restore-test provenance size does not match the private backup object.")
          if provenance.get("backup_sha256") != backup_head.get("Metadata", {}).get("sha256", ""):
              raise SystemExit("Restore-test provenance SHA-256 does not match the private backup object.")
          if provenance.get("target_confirmation") != "g01-restore-test":
              raise SystemExit("Restore-test provenance does not confirm the isolated g01-restore-test target.")
          if provenance.get("project_id") != "wild-credit-40100572":
              raise SystemExit("Restore-test provenance has an unexpected Neon project ID.")
          if provenance.get("branch_id", "").strip() == "" or provenance.get("branch_name") != "g01-restore-test":
              raise SystemExit("Restore-test provenance does not contain a verified branch identity.")
          if provenance.get("endpoint_host", "").strip() == "":
              raise SystemExit("Restore-test provenance does not contain the verified Neon endpoint host.")

          restore_artifacts = get_json(f"/actions/runs/{ids['restore']}/artifacts").get("artifacts", [])
          if not any(a.get("name") == "neon-restore-test-provenance" and not a.get("expired") and a.get("size_in_bytes", 0) > 0 for a in restore_artifacts):
              raise SystemExit("Selected restore-test run has no available provenance artifact.")

          rehearsal_artifacts = get_json(f"/actions/runs/{ids['rehearsal']}/artifacts").get("artifacts", [])
          if not any(a.get("name") == "g01-08-restored-db-migration-rehearsal" and not a.get("expired") and a.get("size_in_bytes", 0) > 0 for a in rehearsal_artifacts):
              raise SystemExit("Selected rehearsal run has no available verification report.")

          print("Authorization phrase accepted.")
          print("Backup, restore-test, and migration-rehearsal runs completed successfully.")
          print(f"Private Neon backup object is present and has SHA-256 metadata: {object_key}")
          print("Restore provenance and migration rehearsal report are available.")
          print("Migration rehearsal evidence is available; migration-source equality will be checked against current main.")
          print("Production migration evidence gate passed.")
          PY


      - name: Verify migration sources match rehearsal commit
        run: |
          set -euo pipefail
          if [[ -z "${REHEARSAL_SHA}" ]]; then
            echo "Missing migration rehearsal commit SHA." >&2
            exit 1
          fi
          git diff --exit-code "${REHEARSAL_SHA}" HEAD -- alembic/versions requirements.txt alembic.ini app/validate_role_catalog.py

      - name: Validate production endpoint and exact baseline (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.NEON_PRODUCTION_HOST }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          EXPECTED_PROJECT_ID: wild-credit-40100572
          EXPECTED_BRANCH_ID: br-jolly-breeze-b3mereg2
        run: |
          set -euo pipefail
          python - <<'PY' | tee production-migration-preflight.txt
          import json
          import os
          import urllib.error
          import urllib.request
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          raw_url = os.environ.get("DATABASE_URL", "")
          expected_host = os.environ.get("EXPECTED_HOST", "").strip().lower()
          api_key = os.environ.get("NEON_API_KEY", "").strip()
          project_id = os.environ["EXPECTED_PROJECT_ID"]
          branch_id = os.environ["EXPECTED_BRANCH_ID"]
          if not raw_url or not expected_host:
              raise SystemExit("Missing DATABASE_URL secret or NEON_PRODUCTION_HOST repository variable.")
          if not api_key:
              raise SystemExit("Missing NEON_API_KEY repository secret; Neon branch identity cannot be verified.")
          api_request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{project_id}/branches/{branch_id}",
              headers={"Accept": "application/json", "Authorization": f"Bearer {api_key}"},
          )
          try:
              with urllib.request.urlopen(api_request, timeout=20) as response:
                  branch_payload = json.load(response).get("branch", {})
          except (urllib.error.HTTPError, urllib.error.URLError) as exc:
              raise SystemExit("Could not verify the expected production branch through the Neon API.") from exc
          if branch_payload.get("id") != branch_id or branch_payload.get("project_id") != project_id or branch_payload.get("name") != "production":
              raise SystemExit("Refusing to proceed: Neon API did not confirm the expected production project and branch.")
          endpoints_request = urllib.request.Request(
              f"https://console.neon.tech/api/v2/projects/{project_id}/branches/{branch_id}/endpoints",
              headers={"Accept": "application/json", "Authorization": f"Bearer {api_key}"},
          )
          try:
              with urllib.request.urlopen(endpoints_request, timeout=20) as response:
                  endpoints = json.load(response).get("endpoints", [])
          except (urllib.error.HTTPError, urllib.error.URLError) as exc:
              raise SystemExit("Could not verify the production branch endpoint through the Neon API.") from exc
          rw_endpoints = [item for item in endpoints if item.get("type") == "read_write" and not item.get("disabled")]
          if len(rw_endpoints) != 1 or rw_endpoints[0].get("branch_id") != branch_id or rw_endpoints[0].get("project_id") != project_id:
              raise SystemExit("Refusing to proceed: expected exactly one active read-write endpoint on the production branch.")
          endpoint_host = (rw_endpoints[0].get("host") or "").lower()
          url = make_url(raw_url)
          actual_host = (url.host or "").lower()
          allowed_hosts = {endpoint_host, endpoint_host.replace(".", "-pooler.", 1)}
          if not endpoint_host or actual_host not in allowed_hosts or actual_host != expected_host:
              raise SystemExit("Refusing to proceed: DATABASE_URL host is not the Neon API-confirmed production branch endpoint (direct or pooler).")
          if url.database != "neondb":
              raise SystemExit("Refusing to proceed: unexpected production database name.")

          baseline = "a7c9e1f3b5d7"
          existing = {
              "accounts", "alembic_version", "audit_logs", "categories",
              "credit_card_payments", "families", "family_members",
              "member_roles", "password_reset_tokens", "permissions",
              "revoked_tokens", "role_data_scopes", "role_permissions",
              "roles", "transactions", "transfers", "user_identities", "users",
              "bills", "recurring_bills", "bill_payments", "attachments",
              "ocr_tasks", "notifications", "export_templates",
              "export_template_versions", "export_schedules", "export_runs",
          }
          new_tables = {
              "bank_import_batches", "bank_import_rows",
              "reconciliation_sessions", "reconciliation_matches",
              "reconciliation_exclusions", "reconciliation_issues",
          }
          scripts = ScriptDirectory.from_config(Config("alembic.ini"))
          expected_chain = [
              "a7c9e1f3b5d7",
              "b8d1f4a6c9e2",
              "d3e5f7a9b1c3",
              "f4a6c8d0e2b4",
              "a6b8c0d2e4f6",
          ]
          for index, revision_id in enumerate(expected_chain):
              revision = scripts.get_revision(revision_id)
              expected_parent = expected_chain[index - 1] if index else "f1a2b3c4d5e6"
              if revision is None or revision.down_revision != expected_parent:
                  raise SystemExit(
                      f"Unexpected Alembic chain at {revision_id}: "
                      f"expected parent {expected_parent}, found "
                      f"{None if revision is None else revision.down_revision}."
                  )
          if scripts.get_revision("a6b8c0d2e4f6") is None:
              raise SystemExit("Authorized target migration is missing from the repository.")

          engine = create_engine(url, pool_pre_ping=True, connect_args={"connect_timeout": 10})
          try:
              with engine.connect() as connection:
                  with connection.begin():
                      connection.exec_driver_sql("SET TRANSACTION READ ONLY")
                      database_name = connection.execute(text("SELECT current_database()")).scalar_one()
                      server_version = connection.execute(text("SHOW server_version")).scalar_one()
                      current = set(MigrationContext.configure(connection, opts={"version_table_schema": "public"}).get_current_heads())
                      tables = set(connection.execute(text("""
                          SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname='public'
                      """)).scalars())
                      missing = sorted(existing - tables)
                      already_new = sorted(new_tables & tables)
                      unexpected = sorted(tables - existing)
                      if database_name != "neondb":
                          raise SystemExit("Unexpected database name.")
                      if current != {baseline}:
                          raise SystemExit(f"Expected baseline {baseline}; found {sorted(current)}.")
                      if missing or already_new or unexpected:
                          raise SystemExit(f"Schema differs from audited baseline: missing={missing}, already_new={already_new}, unexpected={unexpected}.")
                      counts = {}
                      for table in ("families", "users", "accounts", "categories", "transactions", "transfers", "credit_card_payments"):
                          counts[table] = connection.execute(text(f'SELECT count(*) FROM "{table}"')).scalar_one()
          finally:
              engine.dispose()

          print(f"Production database: {database_name}")
          print(f"PostgreSQL version: {server_version}")
          print(f"Production endpoint matched Neon API endpoint and configured host: {expected_host}")
          print(f"Neon API confirmed project {project_id}, branch {branch_id} (production).")
          print(f"Current Alembic baseline: {baseline}")
          print("Authorized Alembic target: a6b8c0d2e4f6")
          print(f"Verified baseline tables: {len(existing)}")
          print("Selected production row counts:")
          for table, count in counts.items():
              print(f"  {table}: {count}")
          print("Read-only production preflight passed.")
          PY

      - name: Apply Alembic migrations to production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python -m alembic upgrade a6b8c0d2e4f6 2>&1 | tee production-alembic-upgrade.log
          python -m alembic current 2>&1 | tee production-alembic-current.txt

      - name: Verify production schema and preserved data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee production-migration-verification.txt
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          new_tables = {
              "bills", "recurring_bills", "bill_payments", "attachments",
              "ocr_tasks", "notifications", "export_templates",
              "export_template_versions", "export_schedules", "export_runs",
          }
          counts_before = {}
          with open("production-migration-preflight.txt", encoding="utf-8") as report:
              for line in report:
                  parts = line.strip().split(": ", 1)
                  if len(parts) == 2 and parts[0] in {
                      "families", "users", "accounts", "categories",
                      "transactions", "transfers", "credit_card_payments"
                  }:
                      counts_before[parts[0]] = int(parts[1])

          scripts = ScriptDirectory.from_config(Config("alembic.ini"))
          expected_revision = {"a6b8c0d2e4f6"}
          engine = create_engine(make_url(os.environ["DATABASE_URL"]), pool_pre_ping=True, connect_args={"connect_timeout": 10})
          try:
              with engine.connect() as connection:
                  current = set(MigrationContext.configure(connection, opts={"version_table_schema": "public"}).get_current_heads())
                  tables = set(connection.execute(text("""
                      SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname='public'
                  """)).scalars())
                  missing = sorted(new_tables - tables)
                  if current != expected_revision:
                      raise SystemExit(f"Alembic revision mismatch: current={sorted(current)}, expected={sorted(expected_revision)}.")
                  if missing:
                      raise SystemExit(f"Missing new G-01 tables: {missing}.")
                  for table, expected in counts_before.items():
                      actual = connection.execute(text(f'SELECT count(*) FROM "{table}"')).scalar_one()
                      if actual < expected:
                          raise SystemExit(f"Existing data count decreased for {table}: before={expected}, after={actual}.")

                  required_indexes = {
                      "uq_bills_family_bill_number_active",
                      "uq_bills_recurring_occurrence",
                      "ix_bill_payments_family_bill_date",
                      "ix_attachments_family_bill_created",
                      "ix_ocr_tasks_family_status_created",
                      "ix_export_schedules_due",
                      "ix_bank_import_batches_family_created",
                      "ix_bank_import_batches_account_created",
                      "ix_bank_import_rows_family_batch_status",
                      "ix_bank_import_rows_family_account_fingerprint",
                      "uq_bank_import_batches_family_id_id",
                      "uq_bank_import_rows_family_id_id",
                      "uq_bank_import_rows_batch_row",
                      "uq_bank_import_batches_family_account_id",
                      "uq_bank_import_rows_family_batch_id",
                      "uq_transactions_family_account_id",
                      "uq_transactions_import_row_id",
                      "uq_reconciliation_sessions_active_period",
                      "uq_reconciliation_sessions_source_batch",
                      "ix_reconciliation_sessions_family_status_period",
                      "ix_reconciliation_sessions_account_period",
                      "uq_reconciliation_matches_active_transaction",
                      "uq_reconciliation_matches_active_row_transaction",
                      "ix_reconciliation_matches_session_row",
                      "ix_reconciliation_matches_transaction",
                      "uq_reconciliation_exclusions_active_row",
                      "ix_reconciliation_exclusions_session_status",
                      "ix_reconciliation_issues_session_status",
                  }
                  indexes = set(connection.execute(text("""
                      SELECT indexname FROM pg_indexes WHERE schemaname='public'
                  """)).scalars())
                  missing_indexes = sorted(required_indexes - indexes)
                  if missing_indexes:
                      raise SystemExit(f"Missing required indexes: {missing_indexes}.")

                  required_foreign_keys = {
                      "fk_bank_import_batches_family_account",
                      "fk_bank_import_batches_family",
                      "fk_bank_import_batches_created_by",
                      "fk_bank_import_batches_confirmed_by",
                      "fk_bank_import_rows_family_batch",
                      "fk_bank_import_rows_duplicate",
                      "fk_transactions_family_import_row",
                      "fk_reconciliation_sessions_family_account",
                      "fk_reconciliation_sessions_family_account_batch",
                      "fk_reconciliation_sessions_created_by",
                      "fk_reconciliation_sessions_completed_by",
                      "fk_reconciliation_matches_family_session_account_batch",
                      "fk_reconciliation_matches_family_import_row",
                      "fk_reconciliation_matches_family_account_transaction",
                      "fk_reconciliation_matches_matched_by",
                      "fk_reconciliation_matches_voided_by",
                      "fk_reconciliation_exclusions_session",
                      "fk_reconciliation_exclusions_import_row",
                      "fk_reconciliation_exclusions_created_by",
                      "fk_reconciliation_exclusions_voided_by",
                      "fk_reconciliation_issues_session",
                      "fk_reconciliation_issues_bank_row",
                      "fk_reconciliation_issues_transaction",
                      "fk_reconciliation_issues_created_by",
                      "fk_reconciliation_issues_updated_by",
                  }
                  foreign_keys = set(connection.execute(text("""
                      SELECT conname FROM pg_constraint
                      WHERE contype='f' AND connamespace='public'::regnamespace
                  """)).scalars())
                  missing_foreign_keys = sorted(required_foreign_keys - foreign_keys)
                  if missing_foreign_keys:
                      raise SystemExit(f"Missing required G-03 foreign keys: {missing_foreign_keys}.")

                  required_checks = {
                      "ck_bank_import_batches_status",
                      "ck_bank_import_batches_counts",
                      "ck_bank_import_rows_status",
                      "ck_bank_import_rows_amount_positive",
                      "ck_bank_import_rows_fingerprint",
                      "ck_reconciliation_sessions_period",
                      "ck_reconciliation_sessions_status",
                      "ck_reconciliation_sessions_counts",
                      "ck_reconciliation_matches_amount_positive",
                      "ck_reconciliation_matches_status",
                      "ck_reconciliation_matches_void_metadata",
                      "ck_reconciliation_exclusions_status",
                      "ck_reconciliation_exclusions_void_metadata",
                      "ck_reconciliation_exclusions_reason",
                      "ck_reconciliation_issues_category",
                      "ck_reconciliation_issues_status",
                      "ck_reconciliation_issues_source_required",
                      "ck_reconciliation_issues_resolution",
                      "ck_reconciliation_issues_reason",
                  }
                  check_constraints = set(connection.execute(text("""
                      SELECT conname FROM pg_constraint
                      WHERE contype='c' AND connamespace='public'::regnamespace
                  """)).scalars())
                  missing_checks = sorted(required_checks - check_constraints)
                  if missing_checks:
                      raise SystemExit(f"Missing required G-03 check constraints: {missing_checks}.")

                  required_triggers = {
                      "trg_check_bill_category_scope",
                      "trg_check_recurring_bill_category_scope",
                  }
                  triggers = set(connection.execute(text("""
                      SELECT trigger_name FROM information_schema.triggers WHERE trigger_schema='public'
                  """)).scalars())
                  missing_triggers = sorted(required_triggers - triggers)
                  if missing_triggers:
                      raise SystemExit(f"Missing required category-scope triggers: {missing_triggers}.")

                  print(f"Final Alembic revision: {sorted(current)}")
                  print(f"Public table count: {len(tables)}")
                  print(f"G-03 tables verified: {len(new_tables)}")
                  print(f"Required indexes verified: {len(required_indexes)}")
                  print(f"Required G-03 foreign keys verified: {len(required_foreign_keys)}")
                  print(f"Required G-03 check constraints verified: {len(required_checks)}")
                  print(f"Required category-scope triggers verified: {len(required_triggers)}")
                  print("Selected existing data row counts did not decrease.")
          finally:
              engine.dispose()
          PY

      - name: Validate role catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.validate_role_catalog

      - name: Upload production migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-finance-production-migration-${{ github.run_number }}
          path: |
            production-migration-preflight.txt
            production-alembic-upgrade.log
            production-alembic-current.txt
            production-migration-verification.txt
          if-no-files-found: warn
          retention-days: 30
