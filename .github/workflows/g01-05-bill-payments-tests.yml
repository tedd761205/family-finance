name: G-01-05 Bill Payments and Refunds Tests

on:
  push:
    branches:
      - g01-05-bill-payments-refunds
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bill-payments:
    name: Bill payments, refunds, permissions, PostgreSQL and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: g01_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify isolated PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/g01_test
        run: |
          set -euo pipefail
          pg_isready --host=localhost --port=5432 --username=postgres --dbname=g01_test
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url
          from app.database import engine
          parsed = make_url(os.environ["DATABASE_URL"])
          if parsed.host != "localhost" or parsed.database != "g01_test":
              raise SystemExit("Refusing to run against a non-isolated database")
          with engine.connect() as connection:
              connection.exec_driver_sql("SELECT 1")
          PY
      - name: Validate migration upgrade, downgrade and re-upgrade
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          createdb --host=localhost --port=5432 --username=postgres g01_migration_test
          cleanup() { dropdb --if-exists --host=localhost --port=5432 --username=postgres g01_migration_test; }
          trap cleanup EXIT
          export DATABASE_URL="postgresql+psycopg://postgres:postgres@localhost:5432/g01_migration_test"
          python -m alembic upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          engine = create_engine(make_url(os.environ["DATABASE_URL"]))
          with engine.connect() as c:
              table_ok = c.execute(text("SELECT to_regclass('public.bill_payments') IS NOT NULL")).scalar_one()
              link_ok = c.execute(text("SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='transactions' AND column_name='bill_payment_id')")).scalar_one()
              permission_count = c.execute(text("SELECT count(*) FROM permissions WHERE code LIKE 'payments.%'")).scalar_one()
              fk_count = c.execute(text("""
                  SELECT count(*) FROM pg_constraint
                  WHERE conname IN (
                    'fk_bill_payments_family_bill',
                    'fk_bill_payments_family_account',
                    'fk_bill_payments_original_payment',
                    'fk_transactions_family_bill_payment'
                  )
              """)).scalar_one()
              unique_index = c.execute(text("""
                  SELECT to_regclass('public.uq_transactions_bill_payment') IS NOT NULL
              """)).scalar_one()
          engine.dispose()
          if not table_ok or not link_ok or permission_count != 4 or fk_count != 4 or not unique_index:
              raise SystemExit("G-01-05 migration objects, relationships, or permissions are incomplete")
          PY
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current
      - name: Validate role catalog
        run: python -m app.validate_role_catalog
      - name: Run full regression suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/g01_test
        run: python -m pytest -q
