name: G-02-01 Web Interface Tests

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "main.py"
      - "static/**"
      - "tests/test_g02_01_web.py"
      - "tests/test_g02_02_accounts_web.py"
      - "tests/test_g02_03_transactions_web.py"
      - "tests/test_g02_04_transfers_web.py"
      - "tests/test_g02_05_credit_card_payments_web.py"
      - "tests/test_g02_06_bills_web.py"
      - "tests/test_g02_07_bill_payments_web.py"
      - "tests/test_g02_08_recurring_bills_web.py"
      - "tests/test_g02_09_financial_reports_web.py"
      - "tests/test_g02_10_family_members_web.py"
      - "tests/test_g02_11_role_permissions_web.py"
      - "tests/test_g02_12_audit_logs_web.py"
      - "tests/test_g02_13_category_management_web.py"
      - "tests/test_g02_14_attachments_ocr_web.py"
      - "tests/test_g02_15_notifications_exports_web.py"
      - "tests/test_local_receipt_ocr.py"
      - "tests/test_g03_01_bank_import_web.py"
      - ".github/workflows/g02-01-web-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "static/**"
      - "tests/test_g02_01_web.py"
      - "tests/test_g02_02_accounts_web.py"
      - "tests/test_g02_03_transactions_web.py"
      - "tests/test_g02_04_transfers_web.py"
      - "tests/test_g02_05_credit_card_payments_web.py"
      - "tests/test_g02_06_bills_web.py"
      - "tests/test_g02_07_bill_payments_web.py"
      - "tests/test_g02_08_recurring_bills_web.py"
      - "tests/test_g02_09_financial_reports_web.py"
      - "tests/test_g02_10_family_members_web.py"
      - "tests/test_g02_11_role_permissions_web.py"
      - "tests/test_g02_12_audit_logs_web.py"
      - "tests/test_g02_13_category_management_web.py"
      - "tests/test_g02_14_attachments_ocr_web.py"
      - "tests/test_g02_15_notifications_exports_web.py"
      - "tests/test_local_receipt_ocr.py"
      - "tests/test_g03_01_bank_import_web.py"
      - ".github/workflows/g02-01-web-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-interface:
    name: Login and family home smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/invoice-csv-import.js
          node --check static/local-receipt-parser.js
          node --check static/local-receipt-ocr.js
          node --test tests/test_local_receipt_parser.cjs

      - name: Run G-02 web interface tests
        run: python -m pytest -q tests/test_g02_01_web.py tests/test_g02_02_accounts_web.py tests/test_g02_03_transactions_web.py tests/test_g02_04_transfers_web.py tests/test_g02_05_credit_card_payments_web.py tests/test_g02_06_bills_web.py tests/test_g02_07_bill_payments_web.py tests/test_g02_08_recurring_bills_web.py tests/test_g02_09_financial_reports_web.py tests/test_g02_10_family_members_web.py tests/test_g02_11_role_permissions_web.py tests/test_g02_12_audit_logs_web.py tests/test_g02_13_category_management_web.py tests/test_g02_14_attachments_ocr_web.py tests/test_g02_15_notifications_exports_web.py tests/test_g03_01_bank_import_web.py tests/test_local_receipt_ocr.py
