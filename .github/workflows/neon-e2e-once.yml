name: Emergency purge of public database backup artifact

on:
  push:
    branches:
      - fix/restore-backup-row-count-manifest
    paths:
      - .github/workflows/neon-e2e-once.yml

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete and verify removal of the public backup artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          repository = os.environ["GH_REPOSITORY"]
          api_url = os.environ["GH_API_URL"].rstrip("/")
          token = os.environ["GH_TOKEN"]
          expected_sha = os.environ["GH_SHA"]
          branch = os.environ["GH_BRANCH"]
          if branch != "fix/restore-backup-row-count-manifest":
              raise SystemExit("Refusing to modify artifacts outside the reviewed PR branch.")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, path):
              req = urllib.request.Request(api_url + path, headers=headers, method=method, data=b"" if method == "DELETE" else None)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")[:1000]
                  if method == "DELETE" and exc.code == 404:
                      return 404, None
                  raise SystemExit(f"GitHub API {method} failed with HTTP {exc.code}: {detail}") from exc

          repo_path = "/repos/" + repository
          _, pr = request("GET", repo_path + "/pulls/59")
          head = pr.get("head") or {}
          head_repo = head.get("repo") or {}
          if (
              pr.get("state") != "open"
              or pr.get("draft") is not True
              or head.get("ref") != branch
              or head_repo.get("full_name") != repository
              or head.get("sha") != expected_sha
          ):
              raise SystemExit("Refusing artifact deletion: PR #59 is not open as Draft at this exact commit.")

          import time
          artifacts_to_delete = [
              (14395743806, 44233524910, "family-finance-neon-backup-7"),
              (14422058635, 44294415773, "family-finance-neon-backup-8"),
              (14427196529, 44302580397, "family-finance-neon-backup-9"),
              (14429689201, 44311589501, "family-finance-neon-backup-10"),
              (14487715668, 44433212436, "family-finance-neon-backup-11"),
              (14591336373, 44650531962, "family-finance-neon-backup-12"),
              (14682083050, 44844907046, "family-finance-neon-backup-13"),
          ]
          for artifact_id, run_id, artifact_name in artifacts_to_delete:
              status, _ = request("DELETE", repo_path + f"/actions/artifacts/{artifact_id}")
              print(f"Artifact {artifact_id} ({artifact_name}) deletion endpoint returned HTTP {status}.", flush=True)

              remaining = None
              for attempt in range(10):
                  _, response = request("GET", repo_path + f"/actions/runs/{run_id}/artifacts?per_page=100")
                  matches = [
                      item for item in (response or {}).get("artifacts", [])
                      if item.get("id") == artifact_id
                  ]
                  if not matches:
                      remaining = response
                      break
                  time.sleep(3)
              if remaining is None:
                  raise SystemExit(f"Artifact {artifact_id} is still listed after repeated deletion verification.")
              print(f"Verified that artifact {artifact_id} is no longer listed for backup run {run_id}.", flush=True)

          _, repository_info = request("GET", repo_path)
          summary = (
              "# Public backup artifact purge\n\n"
              "- Historical Production backup artifacts #7–#13: deletion individually verified\n"
              "- Latest exposed backup artifact #23: previously deleted and independently verified\n"
              f"- Repository visibility: {repository_info.get('visibility')}\n"
              "- Future Production backups are blocked unless repository visibility is private.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY
