name: G-03-02-05 Reconciliation Lifecycle Tests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths:
      - "app/models/reconciliation.py"
      - "app/models/__init__.py"
      - "app/routers/reconciliation.py"
      - "app/schemas/reconciliation.py"
      - "alembic/versions/f4a6c8d0e2b4_add_reconciliation_exclusion_history.py"
      - "tests/test_g03_02_05_reconciliation_lifecycle.py"
      - ".github/workflows/g03-02-05-reconciliation-lifecycle-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    branches:
      - main
    paths:
      - "app/models/reconciliation.py"
      - "app/models/__init__.py"
      - "app/routers/reconciliation.py"
      - "app/schemas/reconciliation.py"
      - "alembic/versions/f4a6c8d0e2b4_add_reconciliation_exclusion_history.py"
      - "tests/test_g03_02_05_reconciliation_lifecycle.py"
      - ".github/workflows/g03-02-05-reconciliation-lifecycle-tests.yml"
      - "requirements.txt"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_finance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d family_finance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/family_finance_test
      JWT_SECRET_KEY: g03-02-05-test-secret-key-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile application, migration and tests
        run: python -m compileall -q app alembic/versions tests main.py
      - name: Validate Alembic graph
        run: alembic heads
      - name: Run lifecycle and reconciliation regression tests
        run: >-
          python -m pytest -q
          tests/test_g03_02_05_reconciliation_lifecycle.py
          tests/test_g03_02_03_reconciliation_matches.py
          tests/test_g03_02_02_reconciliation_sessions.py
          tests/test_g03_02_01_reconciliation_models.py
          tests/test_g03_01_bank_import.py
