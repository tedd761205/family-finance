name: Migrate Legacy Backup Artifact to Private Neon Storage

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly MOVE-PRIVATE-ARTIFACT-14487715668 to transfer the existing Production backup"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: migrate-legacy-neon-backup
  cancel-in-progress: false

jobs:
  transfer:
    name: Verify and move the historical backup to private storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install S3 client
        run: |
          python -m pip install --disable-pip-version-check "boto3>=1.35,<2.0"

      - name: Download and verify the exact existing GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "14487715668"
          TARGET_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_ZIP_SHA256: "92c07b9be42613d0cb96190997043fb95066cc1ddf6e9ba72f30a0eaef78be62"
          EXPECTED_DUMP_SHA256: "4c94cdf6fe11bb4f1b1b48f0576f4533472ba7ebc43d366ce4ea15431eef6712"
          EXPECTED_DUMP_SIZE: "148800"
        run: |
          set -euo pipefail

          if [ "$TARGET_CONFIRMATION" != "MOVE-PRIVATE-ARTIFACT-14487715668" ]; then
            echo "Refusing to transfer: exact confirmation text does not match."
            exit 1
          fi

          ARCHIVE="$RUNNER_TEMP/family-finance-neon-backup-11.zip"
          HEADERS="$RUNNER_TEMP/artifact-response-headers.txt"
          curl --fail --silent --show-error --dump-header "$HEADERS" --output /dev/null \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"

          DOWNLOAD_URL="$(python - "$HEADERS" <<'PY'
          import sys
          from pathlib import Path

          headers = Path(sys.argv[1]).read_text(encoding="iso-8859-1").splitlines()
          locations = [line.split(":", 1)[1].strip() for line in headers if line.lower().startswith("location:")]
          if len(locations) != 1 or not locations[0].startswith("https://"):
              raise SystemExit("GitHub did not return one secure artifact download redirect.")
          print(locations[0])
          PY
          )"
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "GitHub artifact download URL was empty."
            exit 1
          fi

          # Do not forward the GitHub token to the signed artifact URL.
          curl --fail --silent --show-error --location "$DOWNLOAD_URL" --output "$ARCHIVE"
          unset DOWNLOAD_URL

          printf '%s  %s\n' "$EXPECTED_ZIP_SHA256" "$ARCHIVE" | sha256sum --check
          mkdir -p transfer-input
          unzip -q "$ARCHIVE" -d transfer-input

          python - <<'PY'
          import hashlib
          import os
          import shutil
          from pathlib import Path

          root = Path("transfer-input")
          dumps = list(root.rglob("*.dump"))
          if len(dumps) != 1:
              raise SystemExit(f"Expected exactly one dump in the artifact; found {len(dumps)}.")

          source = dumps[0]
          expected_name = "family-finance-20261119T005812Z.dump"
          expected_size = int(os.environ["EXPECTED_DUMP_SIZE"])
          expected_digest = os.environ["EXPECTED_DUMP_SHA256"]

          if source.name != expected_name:
              raise SystemExit(f"Unexpected backup filename: {source.name}")
          if source.stat().st_size != expected_size:
              raise SystemExit(f"Unexpected backup size: {source.stat().st_size}")

          digest = hashlib.sha256()
          with source.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual_digest = digest.hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit("The extracted dump SHA-256 does not match the verified historical backup.")

          destination = Path("transfer-input") / expected_name
          if source != destination:
              shutil.copyfile(source, destination)
          print(f"Verified historical backup: {destination}")
          print(f"Size: {expected_size} bytes")
          print(f"SHA-256: {actual_digest}")
          PY

      - name: Upload and verify in private Neon Object Storage
        env:
          NEON_STORAGE_ENDPOINT: ${{ vars.NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
          NEON_BACKUP_BUCKET: ${{ vars.NEON_BACKUP_BUCKET }}
          NEON_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.NEON_BACKUP_S3_ACCESS_KEY_ID }}
          NEON_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_BACKUP_S3_SECRET_ACCESS_KEY }}
          NEON_RESTORE_S3_ACCESS_KEY_ID: ${{ secrets.NEON_RESTORE_S3_ACCESS_KEY_ID }}
          NEON_RESTORE_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_RESTORE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import boto3
          from botocore.config import Config

          endpoint = os.environ["NEON_STORAGE_ENDPOINT"].strip()
          region = os.environ["NEON_STORAGE_REGION"].strip()
          bucket = os.environ["NEON_BACKUP_BUCKET"].strip()
          write_access_key = os.environ["NEON_BACKUP_S3_ACCESS_KEY_ID"].strip()
          write_secret_key = os.environ["NEON_BACKUP_S3_SECRET_ACCESS_KEY"]
          read_access_key = os.environ["NEON_RESTORE_S3_ACCESS_KEY_ID"].strip()
          read_secret_key = os.environ["NEON_RESTORE_S3_SECRET_ACCESS_KEY"]

          source = Path("transfer-input/family-finance-20261119T005812Z.dump")
          if not endpoint.startswith("https://") or not region or not bucket:
              raise SystemExit("Missing or invalid private Neon Object Storage endpoint configuration.")
          if not all((write_access_key, write_secret_key, read_access_key, read_secret_key)):
              raise SystemExit("Missing one or more scoped Neon Object Storage credentials.")
          if not source.is_file() or source.stat().st_size != 148800:
              raise SystemExit("The exact expected historical dump is not present.")

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          expected_digest = "4c94cdf6fe11bb4f1b1b48f0576f4533472ba7ebc43d366ce4ea15431eef6712"
          actual_digest = sha256_file(source)
          if actual_digest != expected_digest:
              raise SystemExit("Historical dump checksum changed before upload.")

          config = Config(
              signature_version="s3v4",
              s3={"addressing_style": "path"},
              retries={"max_attempts": 3, "mode": "standard"},
          )
          writer = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=write_access_key,
              aws_secret_access_key=write_secret_key,
              config=config,
          )
          reader = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=read_access_key,
              aws_secret_access_key=read_secret_key,
              config=config,
          )

          key = "production/family-finance-20261119T005812Z.dump"
          writer.upload_file(
              str(source),
              bucket,
              key,
              ExtraArgs={
                  "ContentType": "application/octet-stream",
                  "Metadata": {"sha256": actual_digest},
              },
          )

          head = reader.head_object(Bucket=bucket, Key=key)
          if head.get("ContentLength") != source.stat().st_size:
              raise SystemExit("Private backup object size does not match the source.")
          if head.get("Metadata", {}).get("sha256") != expected_digest:
              raise SystemExit("Private backup object SHA-256 metadata does not match the source.")

          downloaded = Path(os.environ["RUNNER_TEMP"]) / source.name
          reader.download_file(bucket, key, str(downloaded))
          if downloaded.stat().st_size != source.stat().st_size or sha256_file(downloaded) != expected_digest:
              raise SystemExit("Private object storage round-trip verification failed.")

          print(f"Historical backup safely stored and verified: {key}")
          print(f"Size: {downloaded.stat().st_size} bytes")
          print(f"SHA-256: {expected_digest}")
          PY
