name: One-time Neon backup and restore rehearsal

on:
  push:
    branches:
      - fix/restore-backup-row-count-manifest
    paths:
      - .github/workflows/neon-e2e-once.yml

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: neon-e2e-one-time-rehearsal
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify the push-triggered backup and isolated restore test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_url = os.environ["GH_API_URL"].rstrip("/")
          expected_sha = os.environ["GH_SHA"]
          branch = os.environ["GH_BRANCH"]
          if branch != "fix/restore-backup-row-count-manifest":
              raise SystemExit("Refusing E2E outside the reviewed PR branch.")
          if not token or not expected_sha:
              raise SystemExit("Missing GitHub token or source commit SHA.")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
          }
          base = api_url + "/repos/" + urllib.parse.quote(repository, safe="/")

          def api_get(path):
              request = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError) as exc:
                  raise SystemExit(f"GitHub API GET {path} failed.") from exc

          pr = api_get("/pulls/59")
          head = pr.get("head") or {}
          head_repo = head.get("repo") or {}
          if (
              pr.get("state") != "open"
              or pr.get("draft") is not True
              or head.get("ref") != branch
              or head_repo.get("full_name") != repository
              or head.get("sha") != expected_sha
          ):
              raise SystemExit("Refusing E2E: PR #59 is not an open Draft at this exact commit.")
          print(f"Verified PR #59 exact head: {expected_sha}", flush=True)

          def wait_for_success(workflow_path, timeout_minutes):
              filename = workflow_path.rsplit("/", 1)[-1]
              workflow = api_get("/actions/workflows/" + urllib.parse.quote(filename, safe=""))
              if workflow.get("path") != workflow_path or not workflow.get("id"):
                  raise SystemExit(f"Could not resolve workflow {workflow_path}.")
              workflow_id = workflow["id"]
              deadline = time.monotonic() + timeout_minutes * 60
              print(f"Waiting for {workflow_path} push run on {expected_sha}.", flush=True)
              while time.monotonic() < deadline:
                  runs = api_get(
                      f"/actions/workflows/{workflow_id}/runs"
                      f"?branch={urllib.parse.quote(branch)}&event=push&per_page=100"
                  ).get("workflow_runs", [])
                  matches = [
                      item for item in runs
                      if item.get("path") == workflow_path and item.get("head_sha") == expected_sha
                  ]
                  if matches:
                      candidate = max(matches, key=lambda item: item.get("run_number", 0))
                      print(
                          f"{workflow_path}: run_id={candidate.get('id')} "
                          f"status={candidate.get('status')} conclusion={candidate.get('conclusion')}",
                          flush=True,
                      )
                      if candidate.get("status") == "completed":
                          if candidate.get("conclusion") != "success":
                              raise SystemExit(
                                  f"{workflow_path} failed with conclusion={candidate.get('conclusion')}."
                              )
                          return candidate
                  time.sleep(15)
              raise SystemExit(f"Timed out waiting for {workflow_path} to complete.")

          backup = wait_for_success(".github/workflows/neon-backup.yml", 40)
          restore = wait_for_success(".github/workflows/neon-restore-test.yml", 45)

          artifacts = api_get(f"/actions/runs/{restore['id']}/artifacts?per_page=100").get("artifacts", [])
          provenance = [
              item for item in artifacts
              if item.get("name") == "neon-restore-test-provenance"
              and item.get("expired") is False
              and item.get("size_in_bytes", 0) > 0
          ]
          if len(provenance) != 1:
              raise SystemExit("Restore succeeded, but its provenance artifact is missing or duplicated.")

          summary = (
              "# Neon backup and restore E2E result\n\n"
              f"- Backup run: {backup['id']} (success)\n"
              f"- Restore run: {restore['id']} (success)\n"
              f"- Source commit: {expected_sha}\n"
              "- Trigger: guarded push event on the reviewed PR branch\n"
              "- Restore target: g01-restore-test\n"
              "- Restore provenance artifact: verified\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary, flush=True)
          PY
