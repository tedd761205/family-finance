name: Neon Database Backup

on:
  workflow_dispatch:
  schedule:
    # 每日台灣時間 03:00（UTC 19:00）
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  group: neon-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create and verify Neon backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show PostgreSQL client version
        run: |
          docker run --rm postgres:18-bookworm pg_dump --version
          docker run --rm postgres:18-bookworm pg_restore --version

      - name: Create custom-format database dump
        id: dump
        env:
          DATABASE_URL: ${{ secrets.NEON_BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Missing GitHub Secret: NEON_BACKUP_DATABASE_URL"
            exit 1
          fi

          case "$DATABASE_URL" in
            postgres://*|postgresql://*)
              ;;
            *)
              echo "Invalid backup URL format. Use the Neon PostgreSQL connection string beginning with postgres:// or postgresql://."
              echo "Do not use SQLAlchemy format such as postgresql+psycopg://."
              exit 1
              ;;
          esac

          mkdir -p "$GITHUB_WORKSPACE/backups"

          BACKUP_FILE="family-finance-$(date -u +%Y%m%dT%H%M%SZ).dump"
          echo "backup_file=$BACKUP_FILE" >> "$GITHUB_OUTPUT"

          echo "Starting database dump (connection string is configured)."
          docker run --rm \
            --env DATABASE_URL \
            --env BACKUP_FILE="$BACKUP_FILE" \
            -v "$GITHUB_WORKSPACE/backups:/backups" \
            postgres:18-bookworm \
            sh -ec 'test -n "$DATABASE_URL"; exec pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --verbose --file="/backups/$BACKUP_FILE"'

          test -s "$GITHUB_WORKSPACE/backups/$BACKUP_FILE"
          ls -lh "$GITHUB_WORKSPACE/backups/$BACKUP_FILE"

      - name: Verify dump archive
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.backup_file }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e BACKUP_FILE \
            -v "$GITHUB_WORKSPACE/backups:/backups:ro" \
            postgres:18-bookworm \
            sh -c 'pg_restore --list "/backups/$BACKUP_FILE" > /tmp/restore-list.txt && test -s /tmp/restore-list.txt && head -n 20 /tmp/restore-list.txt'

      - name: Install S3 client
        run: |
          python -m pip install --disable-pip-version-check "boto3>=1.35,<2.0"

      - name: Upload and verify backup in private Neon Object Storage
        env:
          BACKUP_FILE: ${{ steps.dump.outputs.backup_file }}
          NEON_STORAGE_ENDPOINT: ${{ vars.NEON_STORAGE_ENDPOINT }}
          NEON_STORAGE_REGION: ${{ vars.NEON_STORAGE_REGION }}
          NEON_BACKUP_BUCKET: ${{ vars.NEON_BACKUP_BUCKET }}
          NEON_BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.NEON_BACKUP_S3_ACCESS_KEY_ID }}
          NEON_BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import os
          import re
          import tempfile
          from pathlib import Path

          import boto3
          from botocore.config import Config

          endpoint = os.environ["NEON_STORAGE_ENDPOINT"].strip()
          region = os.environ["NEON_STORAGE_REGION"].strip()
          bucket = os.environ["NEON_BACKUP_BUCKET"].strip()
          access_key = os.environ["NEON_BACKUP_S3_ACCESS_KEY_ID"].strip()
          secret_key = os.environ["NEON_BACKUP_S3_SECRET_ACCESS_KEY"]
          filename = os.environ["BACKUP_FILE"].strip()

          if not endpoint.startswith("https://") or not region or not bucket or not access_key or not secret_key:
              raise SystemExit("Missing or invalid private Neon Object Storage configuration.")
          if not re.fullmatch(r"family-finance-[0-9]{8}T[0-9]{6}Z\.dump", filename):
              raise SystemExit("Unexpected backup filename; refusing to upload.")
          source = Path("backups") / filename
          if not source.is_file() or source.stat().st_size <= 0:
              raise SystemExit("Backup dump is missing or empty.")

          digest = hashlib.sha256(source.read_bytes()).hexdigest()
          size = source.stat().st_size
          key = f"production/{filename}"
          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=access_key,
              aws_secret_access_key=secret_key,
              config=Config(
                  signature_version="s3v4",
                  s3={"addressing_style": "path"},
                  retries={"max_attempts": 3, "mode": "standard"},
              ),
          )

          client.upload_file(
              str(source),
              bucket,
              key,
              ExtraArgs={
                  "ContentType": "application/octet-stream",
                  "Metadata": {"sha256": digest},
              },
          )
          head = client.head_object(Bucket=bucket, Key=key)
          if head.get("ContentLength") != size or head.get("Metadata", {}).get("sha256") != digest:
              raise SystemExit("Uploaded object metadata does not match the source backup.")

          with tempfile.TemporaryDirectory() as temp_dir:
              downloaded = Path(temp_dir) / filename
              client.download_file(bucket, key, str(downloaded))
              downloaded_digest = hashlib.sha256(downloaded.read_bytes()).hexdigest()
              if downloaded.stat().st_size != size or downloaded_digest != digest:
                  raise SystemExit("Private object storage round-trip verification failed.")

          print(f"Private Neon backup verified: {key}")
          print(f"Size: {size} bytes")
          print(f"SHA-256: {digest}")
          PY
