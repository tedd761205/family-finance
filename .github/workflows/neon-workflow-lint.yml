name: Temporary Neon Workflow Lint

on:
  push:
    branches:
      - fix/restore-backup-row-count-manifest
    paths:
      - ".github/workflows/neon-workflow-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install actionlint
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate backup and restore workflows
        run: |
          set -euo pipefail
          actionlint -color .github/workflows/neon-backup.yml .github/workflows/neon-restore-test.yml
