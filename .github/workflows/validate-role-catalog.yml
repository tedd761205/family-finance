name: Validate Role Catalog

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/validate-role-catalog.yml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/validate-role-catalog.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Application Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Validate role catalog
        run: python -m app.validate_role_catalog

      - name: Import family initializer
        run: |
          python -c "from app.services.family_initializer import create_family_with_admin; print('Family initializer import successful')"
