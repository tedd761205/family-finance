name: G-01-08 Restored Production Snapshot Migration Rehearsal

on:
  workflow_dispatch:
    inputs:
      target_confirmation:
        description: "Type exactly g01-restore-test to authorize changes to the isolated restore-test branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g01-08-restored-db-migration-rehearsal
  cancel-in-progress: false

jobs:
  migration-rehearsal:
    name: Upgrade restored Neon test branch to repository head
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate isolated target and restored baseline
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
          EXPECTED_HOST: ${{ vars.NEON_RESTORE_TEST_HOST }}
          TARGET_CONFIRMATION: ${{ inputs.target_confirmation }}
        run: |
          set -euo pipefail
          mkdir -p migration-rehearsal-artifacts
          python - <<'PY' | tee migration-rehearsal-artifacts/baseline.txt
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          if os.environ.get("TARGET_CONFIRMATION") != "g01-restore-test":
              raise SystemExit("Refusing to proceed: target confirmation must be exactly g01-restore-test.")
          raw_url = os.environ.get("DATABASE_URL", "")
          expected_host = os.environ.get("EXPECTED_HOST", "")
          if not raw_url or not expected_host:
              raise SystemExit("Missing isolated restore-test database configuration.")
          url = make_url(raw_url)
          if url.host != expected_host:
              raise SystemExit("Refusing to proceed: database host does not match NEON_RESTORE_TEST_HOST.")
          if url.database != "neondb":
              raise SystemExit("Refusing to proceed: unexpected database name.")

          scripts = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = scripts.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found: {heads}")

          baseline_revision = "f2a4c6e8b0d2"
          expected_existing = {
              "accounts", "alembic_version", "audit_logs", "categories",
              "credit_card_payments", "families", "family_members",
              "member_roles", "password_reset_tokens", "permissions",
              "revoked_tokens", "role_data_scopes", "role_permissions",
              "roles", "transactions", "transfers", "user_identities", "users",
              "bills", "recurring_bills", "bill_payments", "attachments",
              "ocr_tasks", "notifications", "export_templates",
              "export_template_versions", "export_schedules", "export_runs",
              "bank_import_batches", "bank_import_rows",
              "reconciliation_sessions", "reconciliation_matches",
              "reconciliation_exclusions", "reconciliation_issues",
          }
          expected_existing.add("family_invitations")
          expected_new = set()
          engine = create_engine(url, pool_pre_ping=True, connect_args={"connect_timeout": 10})
          try:
              with engine.connect() as connection:
                  version_rows = connection.execute(text(
                      "SELECT version_num FROM public.alembic_version ORDER BY version_num"
                  )).scalars().all()
                  current = set(MigrationContext.configure(
                      connection, opts={"version_table_schema": "public"}
                  ).get_current_heads())
                  tables = set(connection.execute(text("""
                      SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname='public'
                  """)).scalars())
                  missing_existing = sorted(expected_existing - tables)
                  already_migrated = sorted(expected_new & tables)
                  payment_columns = set(connection.execute(text("""
                      SELECT column_name FROM information_schema.columns
                      WHERE table_schema='public' AND table_name='bill_payments'
                  """)).scalars())
                  unexpected_payment_columns = sorted({
                      "account_amount", "account_currency_code", "exchange_rate", "exchange_difference"
                  } & payment_columns)
                  if version_rows != [baseline_revision]:
                      raise SystemExit(
                          "Restored public.alembic_version must contain exactly "
                          f"{baseline_revision}; found {version_rows}."
                      )
                  if current != {baseline_revision}:
                      raise SystemExit(
                          "Alembic's public-schema version lookup disagrees with "
                          f"the direct version-table read: found {sorted(current)}."
                      )
                  if missing_existing:
                      raise SystemExit(f"Restored baseline is missing tables: {missing_existing}")
                  if already_migrated:
                      raise SystemExit(f"Unexpected target tables already exist: {already_migrated}")
                  if unexpected_payment_columns:
                      raise SystemExit(
                          "Restored baseline already contains cross-currency payment columns: "
                          f"{unexpected_payment_columns}"
                      )
                  counts = {}
                  for table in ("families", "users", "accounts", "categories", "transactions", "transfers", "credit_card_payments"):
                      counts[table] = connection.execute(text(f'SELECT count(*) FROM public."{table}"')).scalar_one()
          finally:
              engine.dispose()

          print(f"Target database: {url.database}")
          print(f"Target host matched configured isolated host: {expected_host}")
          print(f"Restored Alembic baseline: {baseline_revision}")
          print(f"Repository Alembic head: {heads[0]}")
          print(f"Existing baseline tables: {len(expected_existing)}")
          print("Selected pre-migration row counts:")
          for table, count in counts.items():
              print(f"  {table}: {count}")
          PY

      - name: Resolve direct Neon endpoint for migration
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
          EXPECTED_POOLER_HOST: ${{ vars.NEON_RESTORE_TEST_HOST }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          expected_host = os.environ["EXPECTED_POOLER_HOST"]
          if url.host != expected_host:
              raise SystemExit("Refusing to resolve a direct endpoint from an unexpected Neon host.")
          if "-pooler." not in url.host:
              raise SystemExit("Expected the configured restore-test URL to use the Neon pooler host.")
          direct_host = url.host.replace("-pooler.", ".", 1)
          direct_url = url.set(host=direct_host)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  "DATABASE_URL="
                  + direct_url.render_as_string(hide_password=False)
                  + "\n"
              )
          print(f"Resolved isolated direct Neon endpoint: {direct_host}")
          PY

      - name: Apply pending migrations to isolated restored snapshot
        env:
          PGOPTIONS: "-c search_path=public"
        run: |
          set -euo pipefail
          python -m alembic upgrade f5b7d9e1a3c5 2>&1 | tee migration-rehearsal-artifacts/alembic-upgrade.log
          python -m alembic current 2>&1 | tee migration-rehearsal-artifacts/alembic-current.txt

      - name: Verify upgraded schema and preserved baseline data
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee migration-rehearsal-artifacts/verification.txt
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          expected_new = {
              "bills", "recurring_bills", "bill_payments", "attachments",
              "ocr_tasks", "notifications", "export_templates",
              "export_template_versions", "export_schedules", "export_runs",
              "family_invitations",
          }
          expected_counts = {}
          with open("migration-rehearsal-artifacts/baseline.txt", encoding="utf-8") as f:
              for line in f:
                  parts = line.strip().split(": ", 1)
                  if len(parts) == 2 and parts[0] in {
                      "families", "users", "accounts", "categories",
                      "transactions", "transfers", "credit_card_payments"
                  }:
                      expected_counts[parts[0]] = int(parts[1])

          scripts = ScriptDirectory.from_config(Config("alembic.ini"))
          expected_revision = {"f5b7d9e1a3c5"}
          engine = create_engine(make_url(os.environ["DATABASE_URL"]), pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  current = set(MigrationContext.configure(
                      connection, opts={"version_table_schema": "public"}
                  ).get_current_heads())
                  tables = set(connection.execute(text("""
                      SELECT tablename FROM pg_catalog.pg_tables WHERE schemaname='public'
                  """)).scalars())
                  missing = sorted(expected_new - tables)
                  if current != expected_revision:
                      raise SystemExit(f"Alembic revision mismatch: current={sorted(current)}, expected={sorted(expected_revision)}")
                  if missing:
                      raise SystemExit(f"Migration did not create required tables: {missing}")

                  for table, expected in expected_counts.items():
                      actual = connection.execute(text(f'SELECT count(*) FROM public."{table}"')).scalar_one()
                      if actual != expected:
                          raise SystemExit(f"Baseline data count changed for {table}: before={expected}, after={actual}")

                  required_indexes = {
                      "uq_bills_family_bill_number_active",
                      "uq_bills_recurring_occurrence",
                      "ix_bill_payments_family_bill_date",
                      "ix_attachments_family_bill_created",
                      "ix_ocr_tasks_family_status_created",
                      "ix_export_schedules_due",
                      "ix_bank_import_batches_family_created",
                      "ix_bank_import_batches_account_created",
                      "ix_bank_import_rows_family_batch_status",
                      "ix_bank_import_rows_family_account_fingerprint",
                      "uq_bank_import_batches_family_id_id",
                      "uq_bank_import_rows_family_id_id",
                      "uq_bank_import_rows_batch_row",
                      "uq_bank_import_batches_family_account_id",
                      "uq_bank_import_rows_family_batch_id",
                      "uq_transactions_family_account_id",
                      "uq_transactions_import_row_id",
                      "uq_reconciliation_sessions_active_period",
                      "uq_reconciliation_sessions_source_batch",
                      "ix_reconciliation_sessions_family_status_period",
                      "ix_reconciliation_sessions_account_period",
                      "uq_reconciliation_matches_active_transaction",
                      "uq_reconciliation_matches_active_row_transaction",
                      "ix_reconciliation_matches_session_row",
                      "ix_reconciliation_matches_transaction",
                      "uq_reconciliation_exclusions_active_row",
                      "ix_reconciliation_exclusions_session_status",
                      "ix_reconciliation_issues_session_status",
                      "ix_family_invitations_family_id",
                      "ix_family_invitations_email",
                      "ix_family_invitations_pending_family_email",
                  }
                  indexes = set(connection.execute(text("""
                      SELECT indexname FROM pg_indexes WHERE schemaname='public'
                  """)).scalars())
                  missing_indexes = sorted(required_indexes - indexes)
                  if missing_indexes:
                      raise SystemExit(f"Required migration indexes are missing: {missing_indexes}")

                  required_foreign_keys = {
                      "fk_bank_import_batches_family_account",
                      "fk_bank_import_batches_family",
                      "fk_bank_import_batches_created_by",
                      "fk_bank_import_batches_confirmed_by",
                      "fk_bank_import_rows_family_batch",
                      "fk_bank_import_rows_duplicate",
                      "fk_transactions_family_import_row",
                      "fk_reconciliation_sessions_family_account",
                      "fk_reconciliation_sessions_family_account_batch",
                      "fk_reconciliation_sessions_created_by",
                      "fk_reconciliation_sessions_completed_by",
                      "fk_reconciliation_matches_family_session_account_batch",
                      "fk_reconciliation_matches_family_import_row",
                      "fk_reconciliation_matches_family_account_transaction",
                      "fk_reconciliation_matches_matched_by",
                      "fk_reconciliation_matches_voided_by",
                      "fk_reconciliation_exclusions_session",
                      "fk_reconciliation_exclusions_import_row",
                      "fk_reconciliation_exclusions_created_by",
                      "fk_reconciliation_exclusions_voided_by",
                      "fk_reconciliation_issues_session",
                      "fk_reconciliation_issues_bank_row",
                      "fk_reconciliation_issues_transaction",
                      "fk_reconciliation_issues_created_by",
                      "fk_reconciliation_issues_updated_by",
                      "family_invitations_family_id_fkey",
                      "family_invitations_invited_by_user_id_fkey",
                      "family_invitations_accepted_by_user_id_fkey",
                  }
                  foreign_keys = set(connection.execute(text("""
                      SELECT conname FROM pg_constraint
                      WHERE contype='f' AND connamespace='public'::regnamespace
                  """)).scalars())
                  missing_foreign_keys = sorted(required_foreign_keys - foreign_keys)
                  if missing_foreign_keys:
                      raise SystemExit(f"Required foreign keys are missing: {missing_foreign_keys}")

                  token_unique = connection.execute(text("""
                      SELECT EXISTS (
                          SELECT 1 FROM pg_constraint
                          WHERE conrelid = 'public.family_invitations'::regclass
                            AND conname = 'uq_family_invitations_token_hash'
                            AND contype = 'u'
                            AND convalidated
                      )
                  """)).scalar_one()
                  pending_index = connection.execute(text("""
                      SELECT i.indisunique, pg_get_expr(i.indpred, i.indrelid) AS predicate
                      FROM pg_index i
                      JOIN pg_class idx ON idx.oid = i.indexrelid
                      JOIN pg_namespace ns ON ns.oid = idx.relnamespace
                      WHERE ns.nspname = 'public'
                        AND idx.relname = 'ix_family_invitations_pending_family_email'
                  """)).one_or_none()
                  if not token_unique:
                      raise SystemExit("Missing validated unique token_hash constraint.")
                  normalized_predicate = (pending_index.predicate or "").replace("::character varying", "").replace("::text", "").replace("(", "").replace(")", "").replace(" ", "") if pending_index is not None else ""
                  if pending_index is None or not pending_index.indisunique or normalized_predicate != "status='pending'":
                      raise SystemExit("Pending family/email index is not unique or does not enforce status = pending.")

                  required_checks = {
                      "ck_bank_import_batches_status",
                      "ck_bank_import_batches_counts",
                      "ck_bank_import_rows_status",
                      "ck_bank_import_rows_amount_positive",
                      "ck_bank_import_rows_fingerprint",
                      "ck_reconciliation_sessions_period",
                      "ck_reconciliation_sessions_status",
                      "ck_reconciliation_sessions_counts",
                      "ck_reconciliation_matches_amount_positive",
                      "ck_reconciliation_matches_status",
                      "ck_reconciliation_matches_void_metadata",
                      "ck_reconciliation_exclusions_status",
                      "ck_reconciliation_exclusions_void_metadata",
                      "ck_reconciliation_exclusions_reason",
                      "ck_reconciliation_issues_category",
                      "ck_reconciliation_issues_status",
                      "ck_reconciliation_issues_source_required",
                      "ck_reconciliation_issues_resolution",
                      "ck_reconciliation_issues_reason",
                      "ck_bill_payments_account_amount_positive",
                      "ck_bill_payments_exchange_rate_positive",
                      "ck_bill_payments_account_currency_code",
                      "ck_bill_payments_payment_exchange_difference_zero",
                      "ck_bill_payments_same_currency_consistent",
                  }
                  check_constraints = set(connection.execute(text("""
                      SELECT conname FROM pg_constraint
                      WHERE contype='c' AND connamespace='public'::regnamespace
                  """)).scalars())
                  missing_checks = sorted(required_checks - check_constraints)
                  if missing_checks:
                      raise SystemExit(f"Required G-03 check constraints are missing: {missing_checks}")

                  required_triggers = {
                      "trg_check_bill_category_scope",
                      "trg_check_recurring_bill_category_scope",
                  }
                  triggers = set(connection.execute(text("""
                      SELECT trigger_name FROM information_schema.triggers
                      WHERE trigger_schema='public'
                  """)).scalars())
                  missing_triggers = sorted(required_triggers - triggers)
                  if missing_triggers:
                      raise SystemExit(f"Required migration triggers are missing: {missing_triggers}")


                  issue_update_permission = connection.execute(text("""
                      SELECT id FROM public.permissions WHERE code = 'reconciliation.update' AND is_active = true
                  """)).scalar_one_or_none()
                  if issue_update_permission is None:
                      raise SystemExit("Missing active reconciliation.update permission after migration rehearsal.")
                  missing_role_grants = connection.execute(text("""
                      SELECT r.id, r.family_id, r.name
                      FROM public.roles r
                      WHERE r.is_system = true
                        AND r.name IN ('家庭管理員', '財務管理員', '記帳人員')
                        AND NOT EXISTS (
                            SELECT 1
                            FROM public.role_permissions rp
                            WHERE rp.role_id = r.id
                              AND rp.permission_id = :permission_id
                        )
                  """), {"permission_id": issue_update_permission}).all()
                  if missing_role_grants:
                      raise SystemExit(
                          "Restored snapshot system roles are missing reconciliation.update: "
                          + repr([(row.id, row.family_id, row.name) for row in missing_role_grants])
                      )

                  print(f"Final Alembic revision: {sorted(current)}")
                  print(f"Public table count after upgrade: {len(tables)}")
                  print(f"G-03 tables verified: {len(expected_new)}")
                  print(f"Required indexes verified: {len(required_indexes)}")
                  print(f"Required G-03 foreign keys verified: {len(required_foreign_keys)}")
                  required_payment_columns = {
                      "account_amount", "account_currency_code", "exchange_rate", "exchange_difference"
                  }
                  missing_payment_columns = sorted(required_payment_columns - payment_columns)
                  if missing_payment_columns:
                      raise SystemExit(f"Missing cross-currency bill payment columns: {missing_payment_columns}")
                  print(f"Cross-currency bill payment columns verified: {len(required_payment_columns)}")
                  print(f"Required G-03 check constraints verified: {len(required_checks)}")
                  print(f"Required category-scope triggers verified: {len(required_triggers)}")
                  print("Selected baseline data row counts remained unchanged.")
                  print("Active reconciliation.update permission and all restored finance/bookkeeping system-role grants verified.")
          finally:
              engine.dispose()
          PY

      - name: Validate role catalog
        env:
          DATABASE_URL: ${{ secrets.NEON_RESTORE_TEST_DATABASE_URL }}
        run: python -m app.validate_role_catalog

      - name: Upload migration rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g01-08-restored-db-migration-rehearsal
          path: migration-rehearsal-artifacts/*
          if-no-files-found: warn
          retention-days: 14
